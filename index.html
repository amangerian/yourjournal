/* Sample one question from every axis first, so no axis (notably adults-vs-children)
   can be squeezed out of a 12-question set by chance. */
/* Not every subtopic name reads well inside a sentence ("AI & clinical informatics
   at the bedside"). Keep the part before an ampersand, drop method-ish names, and fall
   back to questions that don't need a topic at all. */
const BAD_TOPIC = /informatics|methods|technology|synthesis|evidence|outcomes|workflow|equity|education|wellbeing/i;
function cleanTopics(names) {
  const out = [];
  for (const raw of names) {
    if (BAD_TOPIC.test(raw)) continue;            // test the FULL name, before trimming
    const n = raw.split('&')[0].split(',')[0].trim().toLowerCase();
    if (n.length < 5 || n.length > 34) continue;  // "ai" reads badly mid-sentence
    out.push(n);
  }
  return out;
}

function buildPairs() {
  const idx = subtopicIndex();
  const topics = cleanTopics(USER.subtopics.map(k => (idx.get(k) || [null, {}])[1].name).filter(Boolean));
  let seed = [...USER.id].reduce((a, c) => a + c.charCodeAt(0), 0) || 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const shuffle = arr => arr.map(v => [rnd(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);

  /* One question per *asked* axis and no filler. The asked set was chosen by measuring
     how much each axis's signal varies across a real week of articles: an axis that reads
     the same direction on nearly every paper cannot reorder anything, so a question about
     it buys nothing. The rest are inferred from thumbs by relearnAxes(). */
  const axes = shuffle(DATA.axes.axes.filter(a => a.ask !== false));
  const all = axes.map(ax => {
    const qs = shuffle(ax.questions.slice());
    return { ax, qi: ax.questions.indexOf(qs[0]), q: qs[0] };
  });

  return all.map((p, i) => {
    // If we have no usable topic, prefer a sibling question with no {topic} slot.
    let q = p.q;
    if (!topics.length && /\{topic\}/.test(q.low + q.high)) {
      const plain = p.ax.questions.find(x => !/\{topic\}/.test(x.low + x.high));
      if (plain) q = plain;
    }
    const topic = topics.length ? topics[i % topics.length] : 'your field';
    return {
      id: p.ax.id + '#' + p.ax.questions.indexOf(q), axis: p.ax.id, axisName: p.ax.name,
      low: q.low.replace('{topic}', topic),
      high: q.high.replace('{topic}', topic),
    };
  });
}

function viewPairs() {
  /* The count comes from the questions actually built. It used to be hard-coded to 12, from
     when every axis was asked; since the asked set was cut to six by measurement, finishing
     the last question reported "6/12" and read as though half the work were still to do. */
  const pairs = buildPairs();
  const n = pairs.length;
  /* One "No preference" rather than a Both and a Neither. The two were separate buttons but
     the same answer — the submit tally records a neutral for either and cannot tell them
     apart — so the choice between them was work with no consequence. */
  const boxes = pairs.map((p, i) => `<div class="pair" data-qid="${esc(p.id)}" data-axis="${esc(p.axis)}">

    </div>`).join('');
  render('onboard', stepsBar('pairs') + `<h1>This or that</h1>
    <div class="sub">Two papers land in your inbox and you have time for one. Which do you open?

/* Clipboard, with a fallback that matters here: navigator.clipboard needs a secure context,
   and this app is built to be opened straight off the disk from file://, where it is not
   available. execCommand is deprecated and still the only thing that works there. */
async function copyText(s) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(s); return true; }
  } catch (e) { /* fall through to the old way */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = s;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, s.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

const STRUCT = /(?:^|(?<=[.\s]))(?:BACKGROUND|OBJECTIVES?|AIMS?|GOALS?|PURPOSE|INTRODUCTION|CONTEXT|RATIONALE|IMPORTANCE|DESCRIPTION|SUMMARY|UNLABELLED|METHODS?|MATERIALS|DESIGN|SETTINGS?|PARTICIPANTS|PATIENTS|SUBJECTS|INTERVENTIONS?|EXPOSURES?|MEASUREMENTS?|OUTCOMES?|MEASURES?|MAIN|PRIMARY|SECONDARY|STUDY|RESULTS|FINDINGS|CONCLUSIONS?|INTERPRETATION|DISCUSSION|IMPLICATIONS|SIGNIFICANCE|LIMITATIONS|KEY POINTS|TRIAL REGISTRATION|FUNDING)(?:[ /&,-]+(?:AND\s+)?(?:BACKGROUND|OBJECTIVES?|AIMS?|METHODS?|RESULTS|CONCLUSIONS?|MEASURES?|OUTCOMES?|DESIGN|FINDINGS))*\s*:\s*/g;

function firstSentences(text, n = 2, cap = 340) {
  if (!text) return '';
  let t = text.replace(STRUCT, '').replace(/\s{2,}/g, ' ').trim();
  const parts = t.split(/(?<=[.!?])\s+/);
  const out = parts.slice(0, n).join(' ').trim();
  return out.length > cap ? out.slice(0, cap).replace(/\s+\S*$/, '') + '…' : out;
}

/* Group the issue into named sections so the page has landmarks instead of one
   undifferentiated column. Sections come from the reader's own subtopics: an article
   belongs to the subtopic whose keywords it matches most. */
/* Which of the reader's own subtopics does this article belong to? Returns the key so
   callers can group by it; sectionFor() keeps the name-only shape The Paper expects. */
/* Attribution is tier-weighted, not a raw count of matched terms. Subtopic vocabularies
   overlap heavily — "suicidal ideation" sits in both Suicide prevention and Depression —
   so a broad subtopic with a large term list wins a straight count almost every time. That
   quietly defeats the Core quota downstream, which can only seat a topic that some article
   was attributed to. Weighting by tier means that when two of the reader's subtopics both
   fit, the one they said they cared more about gets the article. */
function subtopicOf(a) {
  const idx = subtopicIndex();
  const matched = new Set((a.why?.matched || []).map(t => t.toLowerCase()));
  if (!matched.size) return null;
  let bestKey = null, bestName = null, best = 0;
  for (const key of USER.subtopics) {
    const pair = idx.get(key);
    if (!pair) continue;
    let n = 0;
    for (const t of pair[1].terms) if (matched.has(t.toLowerCase())) n++;
    const w = n * TIER_W[tierOf(USER, key)];
    if (w > best) { best = w; bestKey = key; bestName = pair[1].name; }
  }
  return best ? { key: bestKey, name: bestName } : null;
}

const sectionFor = a => (subtopicOf(a) || {}).name || null;

/* Big-literature topics crowd the small ones out: on a real psychiatry month, three of six
   chosen subtopics took 37 of the top 40 while computational psychiatry got one paper. That
   reads as "it doesn't know what I asked for."

   A heavier tier weight cannot fix this on its own — it tilts a close call, but a topic with
   ten times the publishing volume still wins on sheer count. So Core carries an actual
   guarantee: one seat in the top list whenever the topic has anything worth showing.

   Bounded and floored, because a guarantee that seats anything is worse than none. At most
   a third of the list can be promoted, and never an article scoring below PROMO_FLOOR of the
   one it displaces. Room is made from the bottom, skipping any article that is the last
   representative of a Core subtopic — evicting one Core topic to seat another is churn. */
const PROMO_FLOOR = 0.55;

function topPicks(articles, n = 12) {
  const list = articles.slice(0, n);
  const core = byTier(USER)[0].keys;
  if (!core.length || articles.length <= n) return list;

  const keyOf = a => (subtopicOf(a) || {}).key || null;
  const inList = new Set(list.map(a => a.pmid));
  const held = new Map();                        // core subtopic -> seats it currently holds
  for (const a of list) {
    const k = keyOf(a);
    if (k && core.includes(k)) held.set(k, (held.get(k) || 0) + 1);
  }

  const floor = finalScore(list[list.length - 1]) * PROMO_FLOOR;
  const room = Math.floor(n / 3);
  const promos = [];
  for (const key of core) {
    if (held.has(key) || promos.length >= room) continue;
    const best = articles.find(a =>
      !inList.has(a.pmid) && finalScore(a) >= floor && keyOf(a) === key);
    if (best) { promos.push(best); inList.add(best.pmid); held.set(key, 1); }
  }
  if (!promos.length) return list;

  let drop = promos.length;
  const kept = [];
  for (let i = list.length - 1; i >= 0; i--) {
    const a = list[i], k = keyOf(a);
    if (drop && !(k && held.get(k) === 1)) {
      drop--;
      if (k && held.has(k)) held.set(k, held.get(k) - 1);
      continue;
    }
    kept.unshift(a);
  }
  // Still ordered high-to-low: a promoted article is seated, not given a score it didn't earn.
  return [...kept, ...promos].sort((x, y) => finalScore(y) - finalScore(x));
}

/* Everything the quota could not seat — non-Core topics, and Core ones whose best article
   fell under the floor. Rather than reshuffle the ranking, which would put the scores out
   of order and look broken, surface the best unshown article from each starved subtopic
   separately. The ranking stays honest and nothing a reader asked for silently disappears. */
function starvedPicks(articles, shown, limit = 6) {
  const seen = new Set(shown.map(a => a.pmid));
  const covered = new Set(shown.map(a => (subtopicOf(a) || {}).key).filter(Boolean));
  const idx = subtopicIndex();
  const out = [];
  for (const g of byTier(USER)) for (const key of g.keys) {   // Core first, Occasional last
    if (covered.has(key) || out.length >= limit) continue;
    const best = articles.find(a => !seen.has(a.pmid) && (subtopicOf(a) || {}).key === key);
    if (best) out.push({ article: best, name: (idx.get(key) || [null, {}])[1].name || key });
  }
  return out;
}

/* Four sizes rather than two. Everything below the lead used to render identically, so
   stories 4 through 30 were one undifferentiated grey column — the monotony was the layout
   having no opinion. Size now tracks the tier of the section a story sits in. */
const STORY_LEN = { hero: [4, 560], big: [3, 420], small: [2, 240], tiny: [1, 150] };

function paperStory(a, size) {
  const au = a.authors || [];
  const who = au.length > 2 ? au[0] + ' et al.' : au.join(', ');
  const saved = !!USER.library[a.pmid];
  const fav = !!(USER.favorites || {})[a.pmid];
  const [sent, cap] = STORY_LEN[size] || STORY_LEN.small;
  // `excerpt` is what an archived issue carries in place of the abstract.
  const dek = a.blurb || firstSentences(a.abstract || a.excerpt || '', sent, cap);
  const btn = `<button class="sv paper-sv ${saved ? 'on' : ''}" data-papersave="${esc(a.pmid)}"
    title="Add to To Read Later">${saved ? '📖 Saved' : '📖'}</button>
    <button class="fav paper-sv ${fav ? 'on' : ''}" data-fav="${esc(a.pmid)}"
      title="${fav ? 'Remove from Favorites' : 'Favorite'}">${fav ? '★' : '☆'}</button>
    ${shareControls(a.pmid, 'paper-sv')}`;
  return `<div class="story ${size}">
    <div class="src">${esc(a.journalName || a.journal)}</div>
    <h4><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h4>
    ${badges(a)}
    <div class="dek">${esc(dek)}</div>
    <div class="storyfoot"><span class="src">${esc(who)}</span>
      <span class="scr">${finalScore(a)}</span>${btn}</div></div>`;
}

function viewPaper() {
  const run = USER.run;
  if (!run) return render('paper', '<div class="empty">No issue yet.</div>', true);
  const withAbs = run.articles.filter(a => a.abstract);
  const arts = (withAbs.length ? withAbs : run.articles).slice(0, 30);
  if (!arts.length) return render('paper', '<div class="empty">Nothing to print this week.</div>', true);

  const lead = arts[0];
  const la = lead.authors || [];
  const leadWho = la.length > 2 ? la[0] + ' et al.' : la.join(', ');
  const kicker = lead.tag || sectionFor(lead) || (lead.why?.matched || [])[0] || 'Lead';
  const today = new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const leadSaved = !!USER.library[lead.pmid];

  /* The two stories under the lead are an editorial choice, not simply ranks 2 and 3. If a
     Core subtopic the lead did not come from has anything in the issue, one of the two slots
     goes to its best paper. Every score is still printed beside every story, so nothing is
     being dressed up — this decides placement on the page, not merit. */
  const pool = arts.slice(1);
  const leadKey = (subtopicOf(lead) || {}).key;
  const seconds = [];
  for (const k of byTier(USER)[0].keys) {
    if (seconds.length) break;                       // at most one of the two slots is reserved
    if (k === leadKey) continue;
    const hit = pool.find(a => (subtopicOf(a) || {}).key === k);
    if (hit) seconds.push(hit);
  }
  for (const a of pool) { if (seconds.length >= 2) break; if (!seconds.includes(a)) seconds.push(a); }
  seconds.sort((x, y) => finalScore(y) - finalScore(x));

  const rest = arts.filter(a => a !== lead && !seconds.includes(a));

  /* Grouped by subtopic key rather than by display name, because the key is what carries the
     tier — and the tier is what the order should follow. */
  const MISC = '__misc';
  const groups = new Map();
  for (const a of rest) {
    const s = subtopicOf(a);
    const key = s ? s.key : MISC;
    if (!groups.has(key)) groups.set(key, {
      key, name: s ? s.name : 'Also of note',
      tier: s ? tierOf(USER, key) : 'occasional', list: [],
    });
    groups.get(key).list.push(a);
  }

  /* A one-article section is a header with almost nothing under it, so those merge into the
     miscellany — except when the reader called that subtopic Core. Being folded into a
     generic pile is precisely what Core is supposed to prevent. */
  const misc = groups.get(MISC) || { key: MISC, name: 'Also of note', tier: 'occasional', list: [] };
  for (const g of [...groups.values()]) {
    if (g.key !== MISC && g.list.length === 1 && g.tier !== 'core') {
      misc.list.push(...g.list);
      groups.delete(g.key);
    }
  }
  groups.delete(MISC);
  if (misc.list.length) { misc.list.sort((x, y) => finalScore(y) - finalScore(x)); groups.set(MISC, misc); }

  /* Section order is the reader's stated interest, not the size of the pile. It used to sort
     by article count, so an Occasional subtopic with eight papers opened the page while a Core
     subtopic with two sat near the bottom — the exact inversion the tiers exist to prevent.
     Within a tier, the section holding the better paper leads. */
  const TIER_RANK = { core: 0, interested: 1, occasional: 2 };
  const bestOf = g => Math.max(...g.list.map(finalScore));
  const ordered = [...groups.values()].sort((x, y) =>
    (x.key === MISC ? 1 : 0) - (y.key === MISC ? 1 : 0) ||
    (TIER_RANK[x.tier] ?? 3) - (TIER_RANK[y.tier] ?? 3) ||
    bestOf(y) - bestOf(x));

  /* Column count and story size are driven by tier, so the shape of the page carries meaning
     instead of the old alternating 3-up/2-up, which varied on section index — decoration that
     told the reader nothing. A Core section runs wide with its best paper given room; an
     Occasional one is a tight list. */
  const sections = ordered.map(g => {
    const core = g.tier === 'core' && g.key !== MISC;
    const lean = g.tier === 'occasional' || g.key === MISC;
    const cols = g.list.length === 1 ? ' one' : core ? ' two' : '';
    const stories = g.list.map((a, i) =>
      paperStory(a, core && i === 0 ? 'big' : lean ? 'tiny' : 'small')).join('');
    return `<section class="psec${core ? ' core' : ''}">
      <div class="secthead"><span>${esc(g.name)}</span>
        ${core ? '<span class="tchip">Core</span>' : ''}
        <span class="secn">${g.list.length}</span></div>
      <div class="cols${cols}">${stories}</div>
    </section>`;
  }).join('');

  /* A contents strip, which a front page earns its density with — and which is also the
     quickest way for the reader to see that the order really is their order. */
  const contents = ordered.length ? `<nav class="contents"><b>In this issue</b>
    ${ordered.map(g => `<span class="citem${g.tier === 'core' && g.key !== MISC ? ' core' : ''}">${
      esc(g.name)}<i>${g.list.length}</i></span>`).join('')}</nav>` : '';

  // Design markers are the most interesting thing about a week; say so on the masthead rule.
  let trials = 0, guides = 0;
  for (const a of arts) {
    const pc = practiceChanging(a);
    if (!pc) continue;
    if (pc.kind === 'guideline') guides++; else trials++;
  }
  const marks = [trials ? `${trials} randomised` : '', guides ? `${guides} guideline${guides > 1 ? 's' : ''}` : '']
    .filter(Boolean).join(' · ');

  render('paper', toReadLaterStrip(3) + `<div class="paper">
    <div class="masthead"><h1>Your Journal</h1>
      <div class="dek">Curated for ${esc(USER.name)}</div></div>
    <div class="rule"><span>${esc(today)}</span><span>${run.articles.length} papers screened</span>
      ${marks ? `<span>${esc(marks)}</span>` : ''}<span>${run.journals} journals</span></div>
    ${contents}

    <div class="lead"><div class="kick">${esc(kicker)}</div>
      <h3><a href="${esc(lead.url)}" target="_blank" rel="noopener">${esc(lead.title)}</a></h3>
      <div class="byline">${esc(leadWho)} · ${esc(lead.journalName || lead.journal)}</div>
      ${badges(lead)}
      <div class="body"><p>${esc(lead.blurb || firstSentences(lead.abstract || lead.excerpt || '', 4, 900))}</p></div>
      <div class="storyfoot"><span class="scr">${finalScore(lead)}</span>
        <button class="sv paper-sv ${leadSaved ? 'on' : ''}" data-papersave="${esc(lead.pmid)}"
          title="Add to To Read Later">${leadSaved ? '📖 Saved' : '📖 Read later'}</button>
        <button class="fav paper-sv ${(USER.favorites || {})[lead.pmid] ? 'on' : ''}"
          data-fav="${esc(lead.pmid)}" title="Favorite">${(USER.favorites || {})[lead.pmid] ? '★' : '☆'}</button>
        ${shareControls(lead.pmid, 'paper-sv')}</div>
    </div>

    ${seconds.length ? `<div class="seconds">${seconds.map(a => paperStory(a, 'big')).join('')}</div>` : ''}
    ${sections}

    <div class="papernote">Assembled from ${run.articles.length} articles indexed ${run.since} to
      ${run.until}. <a data-view="feed">Rate these in the feed →</a> ·
      <a data-view="how">How the ranking works →</a></div></div>`, true);
}

/* The open archived issue, so rating and favouriting work from it exactly as they do in the
   feed — findArticle() consults this. Held outside USER because it is a view, not profile
   state, and must never be written back into the profile. */
let OPEN_ISSUE = null;

function viewIssues() {
  const idx = archIndex(USER.id);
  const cur = USER.run;
  const row = (m, isCur) => `<li class="issrow" ${isCur ? '' : `data-openissue="${esc(m.id)}"`}>
    <span class="isdate">${esc(m.since)} → ${esc(m.until)}</span>
    <span class="islead">${esc(m.lead || '—')}</span>
    <span class="ismeta">${m.count} articles · ${m.journals} journals${m.reranked ? ' · ✓ Claude' : ''}</span>
    <span class="isgo">${isCur ? '<b>current</b>' : 'open →'}</span></li>`;

  if (!idx.length && !cur) return render('issues', `<h1>Past issues</h1>
    <div class="empty">No issues yet. <a data-act="scan">Fetch this week</a>.</div>`);

  render('issues', `<h1>Past issues</h1>
    <div class="sub">Each issue is archived when the next one is fetched — ${idx.length} kept.
    They hold their titles, journals, scores, blurbs, matched terms and a short excerpt; the
    full abstracts are dropped, which is what lets months of reading fit in the browser.</div>
    <ul class="isslist">
      ${cur ? row({ since: cur.since, until: cur.until, journals: cur.journals,
                    count: (cur.articles || []).length, reranked: cur.reranked,
                    lead: (cur.articles || [])[0]?.title || '' }, true) : ''}
      ${idx.map(m => row(m, false)).join('')}
    </ul>`);
}

function viewIssue(id) {
  const meta = archIndex(USER.id).find(m => m.id === id);
  const arts = loadIssue(USER.id, id);
  if (!meta || !arts) {
    OPEN_ISSUE = null;
    return render('issues', `<h1>Past issues</h1>
      <div class="empty">That issue is no longer stored. <a data-view="issues">Back to the list</a></div>`);
  }
  OPEN_ISSUE = { id, articles: arts };
  const top = arts.slice(0, 12), more = arts.slice(12, 40);
  render('issues', `<h1>${esc(meta.since)} → ${esc(meta.until)}</h1>
    <div class="sub">${meta.count} articles · ${meta.journals} journals${meta.reranked ? ' · ✓ re-ranked by Claude' : ''}
     · <a data-view="issues">← all issues</a></div>
    <div class="note">An archived issue. Scores are the ones it was given at the time —
    re-tiering your topics or rating more since then does not rewrite history. Rating and
    saving from here still works.</div>
    <h2>Top picks</h2>${top.map((a, i) => articleCard(a, i + 1)).join('')}
    ${more.length ? `<h2>Also worth a look · 13–${12 + more.length}</h2>
      ${more.map((a, i) => articleCard(a, i + 13)).join('')}` : ''}`);
}

function viewSaved() {
  const items = Object.values(USER.library).sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || ''));
  if (!items.length) return render('saved', `<h1>To Read Later</h1>
    <div class="empty">Nothing saved yet. Hit <b>📖 Read later</b> on any article in the
    <a data-view="feed">Feed</a> or <a data-view="paper">The Paper</a>.</div>`);
  render('saved', `<h1>To Read Later</h1>
    <div class="sub">${items.length} articles · newest first · saving never changes your ranking</div>` +
    items.map((it, i) => articleCard({ ...it, why: { matched: [] } }, i + 1, { noMeter: true })).join(''));
}

function viewFavorites() {
  const items = Object.values(USER.favorites || {})
    .sort((a, b) => (b.favedAt || '').localeCompare(a.favedAt || ''));
  if (!items.length) return render('favorites', `<h1>Favorites</h1>
    <div class="empty">Nothing favorited yet. Hit <b>☆ Favorite</b> on any article in the
    <a data-view="feed">Feed</a> or <a data-view="paper">The Paper</a>.
    <p class="hint">Favorites are the keepers — 📖 <a data-view="saved">To Read Later</a> is the
    queue you work through. Neither one changes your ranking.</p></div>`);
  render('favorites', `<h1>Favorites</h1>
    <div class="sub">${items.length} kept · newest first · favoriting never changes your ranking</div>` +
    items.map((it, i) => articleCard({ ...it, why: { matched: [] } }, i + 1, { noMeter: true })).join(''));
}

function viewSettings() {
  const idx = subtopicIndex();
  const nameOf = k => (idx.get(k) || [null, {}])[1].name || k;
  const tierRows = byTier(USER).filter(g => g.keys.length).map(g =>
    `<div><b>${esc(g.label)}</b> <span class="chip">×${g.w.toFixed(2)}</span>
      ${g.keys.map(k => esc(nameOf(k))).join(' · ')}</div>`).join('');
  const ev = USER.axisEvidence || {}, prior = USER.axisPrior || {};
  const axRows = Object.entries(USER.axisScores).map(([id, v]) => {
    const ax = DATA.axes.axes.find(a => a.id === id);
    if (!ax) return '';
    const strength = Math.abs(v) > 0.6 ? 'strongly' : Math.abs(v) > 0.2 ? 'mildly' : 'barely';
    const txt = Math.abs(v) > 0.05 ? `${strength} toward <b>${esc(v > 0 ? ax.high_label : ax.low_label)}</b>` : 'no preference';
    /* Say "your thumbs disagree" only when the *direction* actually flipped — a smaller
       number in the same direction is confirmation, not contradiction. */
    const asked = prior[id] !== undefined;
    const n = ev[id] || 0;
    const flipped = asked && Math.sign(v) !== 0 && Math.sign(v) !== Math.sign(prior[id]);
    const src = !asked
      ? `<span class="chip learned">learned from ${n} rating${n === 1 ? '' : 's'}</span>`
      : flipped
        ? `<span class="chip learned">you said ${esc(prior[id] > 0 ? ax.high_label : ax.low_label)} — your thumbs disagree</span>`
        : n ? `<span class="chip">you said this · ${n} rating${n === 1 ? '' : 's'} agree</span>`
            : '<span class="chip">you said this</span>';
    return `<div class="story"><div class="src">${esc(ax.name)}</div>
      <div class="dek">${txt} ${src}</div></div>`;
  }).join('');
  const reg = DATA.journals.journals;
  const jl = USER.journals.map(a => (reg[a] || {}).name || a).join(', ');
  const n = { love: 0, like: 0, dislike: 0 };
  for (const r of Object.values(USER.feedback)) if (n[r.verdict] !== undefined) n[r.verdict]++;
  const key = lsGet('anthropicKey', '');
  render('settings', `<h1>Your formula</h1>
    <div class="sub">Everything here is editable. Changes apply from your next issue.
    <a data-view="how">How it all works →</a></div>
    <h2>Topics · by interest tier</h2>
      <div class="sub">${tierRows || 'none'}
      <div style="margin-top:.5rem">Core topics carry more weight and are guaranteed a slot
      in every issue. <a data-goto="subtopics">change or re-tier</a></div></div>
    <h2>Past issues · ${archIndex(USER.id).length}</h2>
      <div class="sub">Each issue is archived when the next one is fetched. Archived issues
      drop their full abstracts — titles, journals, scores, blurbs, matched terms and a
      two-sentence excerpt stay — which takes a week from about 300 KB to 78 KB. They are kept
      newest-first until they fill ${Math.round(ARCH_BUDGET / 1048576)} MB, roughly nine months
      of weekly reading, and are included when you export this profile.
      <a data-view="issues">browse them →</a></div>
    <h2>Appearance</h2>
      <div class="sub">Applies to this browser, for every profile on it.</div>
      ${themePicker()}
    <h2>Is it working?</h2>${calibrationPanel(USER)}
    <h2>Reading style</h2>
      <div class="sub">Six of these you answered; the rest are inferred from what you rate.
      Your answers stay as the starting point — thumbs move it from there.</div>
      <div class="cols two">${axRows}</div>
      <div class="sub" style="margin-top:1rem"><a data-goto="pairs">retake the this-or-that</a></div>
    <h2>Journals · ${USER.journals.length}</h2><div class="sub">${esc(jl) || 'none'} ·
      <a data-goto="journals">change or add more</a></div>
    <h2>What it has learned</h2>
      <div class="sub">${n.love} 👍👍 · ${n.like} 👍 · ${n.dislike} 👎 ·
      ${Object.keys(USER.weights).length} learned terms. The more you rate, the more your ranking
      diverges from the generic version of your specialty.</div>

    <h2>Claude re-rank (optional)</h2>
    <div class="sub">The feed ranks by keyword match. With an API key, Claude reads the top 30
      abstracts and rewrites the scores with a one-line reason each — the pass that makes this
      genuinely good. Roughly a few cents per issue.</div>
    <details class="keyhelp"><summary>How to get an Anthropic API key (2 minutes)</summary>
      <ol>
        <li>Go to <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a>
          and sign in. <b>This is the developer console, not the Claude chat app</b> — a Claude Pro or
          Max subscription does not include API credit; they're billed separately.</li>
        <li>If it's a new account, open <b>Billing</b> and add a small amount of credit
          (US$5 goes a very long way here — a weekly re-rank costs a few cents).</li>
        <li>Go to <b>Settings → API keys</b>, or straight to
          <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com/settings/keys</a>.</li>
        <li>Click <b>Create key</b>, name it something like <i>Your Journal</i>, and copy it.
          It starts with <code>sk-ant-</code>. <b>You can only see it once</b> — if you lose it,
          delete that key and make a new one.</li>
        <li>Paste it below and press Save.</li>
      </ol>
      <p><b>Where it goes.</b> The key is stored in this browser only and sent directly from your
      browser to Anthropic. It never reaches a server of ours, because there isn't one. Anyone with
      access to this device or browser profile can read it — so don't do this on a shared computer,
      and delete the key in the console if you ever stop using it.</p>
    </details>
    <div class="row"><input type="password" id="apikey" placeholder="sk-ant-..." value="${esc(key)}" autocomplete="off">
      <button class="btn" data-act="savekey">Save key</button>
      ${key ? '<button class="btn ghost" data-act="clearkey">Remove key</button>' : ''}</div>

    <h2>Your data</h2>
    <div class="sub">Everything lives in this browser. Clearing site data erases it — export a copy
      to move to another device or keep a backup.</div>
    <div class="row"><button class="btn ghost" data-act="export">Export profile</button>
      <button class="btn ghost" data-view="switch">Switch reader</button>
      <button class="btn ghost" data-act="scan">Fetch a new issue</button></div>`);
}

/* The scan takes ~15s. Staring at a progress bar teaches nothing, and this is the one moment
   a new reader is captive and curious — so the wait carries the explanation of what they
   just built and what to do with it. */
function viewBuilding(msg) {
  const idx = subtopicIndex();
  const subs = USER.subtopics.map(k => (idx.get(k) || [null, {}])[1].name).filter(Boolean);
  const strong = Object.entries(USER.axisScores || {})
    .filter(([, v]) => Math.abs(v) > 0.5)
    .map(([id, v]) => {
      const ax = DATA.axes.axes.find(a => a.id === id);
      return ax ? esc(v > 0 ? ax.high_label : ax.low_label) : null;
    }).filter(Boolean);

  render('onboard', `<h1>Building your issue</h1>
    <div class="sub">Searching ${USER.journals.length} journals, then scoring every result
    against your formula. About fifteen seconds.</div>
    <div class="note" id="scanbox"><b>${esc(msg || 'starting…')}</b></div>

    <h2>While that runs — what you just built</h2>
    <div class="waitgrid">
      <div class="waitcard"><div class="wn">Your topics</div>
        <p>${subs.length ? esc(subs.slice(0, 8).join(' · ')) + (subs.length > 8 ? ' …' : '') : '—'}</p>
        <p class="hint">Core topics carry more weight and hold a slot in every issue.</p></div>
      <div class="waitcard"><div class="wn">Your reading style</div>
        <p>${strong.length ? esc(strong.join(' · ')) : 'No strong leanings yet — your thumbs will fill this in.'}</p>
        <p class="hint">From the six questions. Every 👍 and 👎 refines it from here.</p></div>
      <div class="waitcard"><div class="wn">What to do first</div>
        <p>Rate a handful — including a few 👎. Ratings you dislike matter as much as the ones
        you like, because without them there is nothing to tell apart.</p>
        <p class="hint">After about twenty, <b>Settings → Is it working?</b> starts scoring itself.</p></div>
      <div class="waitcard"><div class="wn">Two ways to read</div>
        <p><b>Feed</b> is the ranked list, for triage. <b>The Paper</b> lays the same week out as
        a front page with short summaries, for actually reading.</p>
        <p class="hint">📖 shelves for later · ★ keeps for good · neither changes your ranking.</p></div>
    </div>`);
}

function go(view) {
  // Navigating anywhere abandons a half-made delete rather than leaving it armed.
  PENDING_DELETE = null;
  if (view === 'how' && !USER) { const u = USER; USER = { name: '', step: '', library: {} };
    viewHow(); USER = u; return; }
  if (view === 'switch') { lsSet('active', null); USER = null; return viewPick(); }
  if (!USER) return viewPick();
  if (view === 'how') return viewHow();
  if (view === 'onboard') view = USER.step;
  switch (view) {
    case 'specialties': return viewSpecialties();
    case 'subtopics': return viewSubtopics();
    case 'pairs': return viewPairs();
    case 'journals': return viewJournals();
    case 'feed': case 'ready': return viewFeed();
    case 'paper': return viewPaper();
    case 'saved': return viewSaved();
    case 'favorites': return viewFavorites();
    case 'issues': OPEN_ISSUE = null; return viewIssues();
    case 'settings': return viewSettings();
    default: return viewFeed();
  }
}

/* The first issue reaches back a month, not a week. A single week of one specialty is a
   thin, arbitrary slice — often nothing lands near the reader's actual interests, and the
   first impression is of a ranker that does not work. A month gives it enough to rank.
   After that a week is right, because everything older has already been seen. */
const FIRST_SCAN_DAYS = 30, WEEKLY_SCAN_DAYS = 8;

async function doScan() {
  if (!USER.journals.length) { toast('Pick some journals first.'); return go('journals'); }
  const first = !USER.run;
  viewBuilding(first ? 'building your first issue — looking back a month…' : 'starting…');
  const box = $('#scanbox');
  try {
    const run = await runScan(USER, first ? FIRST_SCAN_DAYS : WEEKLY_SCAN_DAYS, (msg, done, total) => {
      box.innerHTML = `<b>${esc(msg)}</b>${total ? ` — ${done.toLocaleString()} / ${total.toLocaleString()}` : ''}
        <div class="prog"><i style="width:${total ? Math.round(done / total * 100) : 5}%"></i></div>`;
    });
    if (!run.articles.length) {
      box.innerHTML = '<b>Nothing new since your last issue.</b> Try again in a few days.';
      setTimeout(() => go('feed'), 2200);
      return;
    }
    // Archive the outgoing issue before it is replaced — this is the only moment it exists.
    archiveRun(USER, USER.run);
    USER.run = run; USER.step = 'ready'; saveUser();
    go('feed');
  } catch (e) {
    box.innerHTML = `<b>Scan failed.</b> ${esc(e.message)}`;
  }
}

async function doRerank() {
  const run = USER.run;
  if (!run) return;
  const prev = $('#app').innerHTML;
  render('feed', `<h1>Re-ranking</h1><div class="note" id="rr"><b>starting…</b></div>`);
  try {
    const n = await claudeRerank(run, USER, msg => { $('#rr').innerHTML = `<b>${esc(msg)}</b>
      <div class="prog"><i style="width:60%"></i></div>`; });
    saveUser();
    toast(`Claude re-ranked ${n} articles.`);
    go('feed');
  } catch (e) {
    $('#rr').innerHTML = `<b>Re-rank failed.</b> ${esc(e.message)}
      <div style="margin-top:.6rem">Your keyword ranking is unchanged. <a data-view="feed">Back to the feed</a> ·
      <a data-view="settings">Settings</a></div>`;
  }
}

function findArticle(pmid) {
  return (USER.run?.articles || []).find(a => a.pmid === pmid)
    || (OPEN_ISSUE?.articles || []).find(a => a.pmid === pmid)
    || USER.library[pmid] || (USER.favorites || {})[pmid]
    || { pmid, title: '', abstract: '' };
}

document.addEventListener('click', async e => {
  const t = e.target;

  /* Any click anywhere closes an open share menu, except one inside the menu itself or on the
     button that opened it. Runs first so it cannot be skipped by an early return below. */
  const inShare = t.closest('.sharewrap');
  if (!inShare) closeShareMenus();

  const shareBtn = t.closest('[data-share]');
  if (shareBtn) {
    e.preventDefault();
    const menu = shareBtn.parentElement.querySelector('.sharemenu');
    const opening = menu.hidden;
    closeShareMenus(menu);
    menu.hidden = !opening;
    /* The button sits at the end of a wrapping row, so it can end up anywhere across the
       width. Anchor left by default and flip to right only if that would run off screen.
       Skipped on phones, where the menu is a full-width sheet and has nothing to clip. */
    if (!menu.hidden && window.matchMedia('(min-width:621px)').matches) {
      menu.style.left = '0';
      menu.style.right = 'auto';
      if (menu.getBoundingClientRect().right > document.documentElement.clientWidth - 8) {
        menu.style.left = 'auto';
        menu.style.right = '0';
      }
    }
    return;
  }

  const copyBtn = t.closest('[data-copylink]');
  if (copyBtn) {
    e.preventDefault();
    const a = findArticle(copyBtn.dataset.copylink);
    toast(await copyText(shareUrl(a)) ? 'Link copied.' : 'Could not copy — the link is in the title.');
    closeShareMenus();
    return;
  }

  const smsBtn = t.closest('[data-smslink]');
  if (smsBtn) {
    e.preventDefault();
    const a = findArticle(smsBtn.dataset.smslink);
    /* "sms:?&body=" is the one spelling both iOS and Android accept — iOS wants sms:&body=,
       Android wants sms:?body=, and the empty query before the ampersand satisfies both. */
    window.location.href = 'sms:?&body=' + encodeURIComponent(shareBody(a));
    closeShareMenus();
    return;
  }

  const natBtn = t.closest('[data-nativeshare]');
  if (natBtn) {
    e.preventDefault();
    const a = findArticle(natBtn.dataset.nativeshare);
    closeShareMenus();
    try {
      await navigator.share({ title: a.title, text: a.title, url: shareUrl(a) });
    } catch (err) {
      // AbortError just means the reader dismissed the sheet; nothing to report.
      if (err && err.name !== 'AbortError') toast('Sharing was not available.');
    }
    return;
  }

  const delStart = t.closest('[data-delprof]');
  if (delStart) { PENDING_DELETE = delStart.dataset.delprof; return viewPick(); }

  const delCancel = t.closest('[data-delcancel]');
  if (delCancel) { PENDING_DELETE = null; return viewPick(); }

  const delExport = t.closest('[data-delexport]');
  if (delExport) {
    const u = loadProfile(delExport.dataset.delexport);
    if (u) { exportProfile(u); toast('Exported. The delete is still waiting.'); }
    return;
  }

  const delGo = t.closest('[data-delconfirm]');
  if (delGo) {
    const id = delGo.dataset.delconfirm;
    const gone = (listProfiles().find(p => p.id === id) || {}).name || 'Profile';
    deleteProfile(id);
    PENDING_DELETE = null;
    toast(`Deleted ${gone}.`);
    return viewPick();
  }

  const use = t.closest('[data-use]');
  if (use) { const u = loadProfile(use.dataset.use); if (u) { USER = u; lsSet('active', u.id); go(u.step === 'ready' ? 'feed' : 'onboard'); } return; }

  const openIss = t.closest('[data-openissue]');
  if (openIss) { e.preventDefault(); return viewIssue(openIss.dataset.openissue); }

  const viewEl = t.closest('[data-view]');
  if (viewEl) { e.preventDefault(); return go(viewEl.dataset.view); }

  const gotoEl = t.closest('[data-goto]');
  if (gotoEl) { e.preventDefault(); return go(gotoEl.dataset.goto); }

  if (t.id === 'create') {
    const name = $('#newname').value.trim();
    if (!name) return toast('Enter a name.');
    USER = newProfile(name.slice(0, 40));
    return go('onboard');
  }

  const selAll = t.closest('[data-selectall]'), selNone = t.closest('[data-selectnone]');
  if (selAll || selNone) {
    const sid = (selAll || selNone).dataset.selectall || (selNone).dataset.selectnone;
    const grp = (selAll || selNone).closest('.grp');
    grp.querySelectorAll('.pick.multi').forEach(p => p.classList.toggle('on', !!selAll));
    const form = grp.closest('form');
    if (form?.dataset.next === 'pairs') {
      const keys = [...grp.querySelectorAll('.pick.multi')].map(p => p.dataset.val);
      const set = new Set(keys);
      if (selAll) USER.subtopics = [...USER.subtopics, ...keys.filter(k => !USER.subtopics.includes(k))];
      else {
        USER.subtopics = USER.subtopics.filter(k => !set.has(k));
        if (USER.tiers) for (const k of keys) delete USER.tiers[k];
      }
      refreshTierPanel(form);
    }
    countBtn(form);
    return;
  }

  // 📖 from The Paper
  const psave = t.closest('[data-papersave]');
  if (psave) {
    const pmid = psave.dataset.papersave, on = !USER.library[pmid];
    const a = findArticle(pmid);
    if (on) {
      USER.library[pmid] = { pmid, title: a.title, journalName: a.journalName || a.journal,
        authors: (a.authors || []).slice(0, 6), url: a.url, score: finalScore(a),
        blurb: a.blurb || '', savedAt: new Date().toISOString() };
    } else delete USER.library[pmid];
    saveUser();
    psave.classList.toggle('on', on);
    psave.textContent = on ? '📖 Saved' : '📖';
    syncCounts();
    toast(on ? 'Added to To Read Later' : 'Removed');
    return;
  }

  const unsave = t.closest('[data-unsave]');
  if (unsave) { delete USER.library[unsave.dataset.unsave]; saveUser(); return go(currentView()); }

  const multi = t.closest('.pick.multi');
  if (multi) {
    multi.classList.toggle('on');
    const form = multi.closest('form');
    // On the subtopics screen the panel above tracks the selection live. A new pick lands
    // in the default tier; deselecting drops its tier too, so nothing stale is kept.
    if (form?.dataset.next === 'pairs') {
      const key = multi.dataset.val;
      if (multi.classList.contains('on')) {
        if (!USER.subtopics.includes(key)) USER.subtopics.push(key);
      } else {
        USER.subtopics = USER.subtopics.filter(k => k !== key);
        if (USER.tiers) delete USER.tiers[key];
      }
      refreshTierPanel(form);
    }
    countBtn(form);
    return;
  }

  /* ★ works from the Feed, The Paper and the Favorites list itself. Updates in place —
     a full re-render would scroll the reader back to the top mid-triage. The one
     exception is the Favorites list, where un-starring has to remove the row. */
  const favBtn = t.closest('[data-fav]');
  if (favBtn) {
    const pmid = favBtn.dataset.fav;
    USER.favorites = USER.favorites || {};
    const on = !USER.favorites[pmid];
    if (on) {
      const a = findArticle(pmid);
      USER.favorites[pmid] = { pmid, title: a.title, journalName: a.journalName || a.journal,
        authors: (a.authors || []).slice(0, 6), url: a.url, score: finalScore(a),
        abstract: a.abstract || '', blurb: a.blurb || '', favedAt: new Date().toISOString() };
    } else delete USER.favorites[pmid];
    saveUser();
    if (VIEW === 'favorites') return go('favorites');
    const inPaper = !!favBtn.closest('.story');
    favBtn.classList.toggle('on', on);
    favBtn.textContent = inPaper ? (on ? '★' : '☆') : (on ? '★ Favorite' : '☆ Favorite');
    favBtn.title = on ? 'Remove from Favorites' : 'Favorite';
    favBtn.closest('.card')?.classList.toggle('favd', on);
    syncCounts();
    return;
  }

  const tb = t.closest('[data-settier]');
  if (tb) {
    const key = tb.dataset.key, to = tb.dataset.settier;
    USER.tiers = USER.tiers || {};
    if (to === 'off') {
      USER.subtopics = USER.subtopics.filter(k => k !== key);
      delete USER.tiers[key];
      const tile = document.querySelector(`.pick.multi[data-val="${CSS.escape(key)}"]`);
      if (tile) tile.classList.remove('on');
    } else if (TIER_W[to] !== undefined) {
      USER.tiers[key] = to;
    } else return;
    const form = document.getElementById('multi');
    refreshTierPanel(form);
    countBtn(form);
    return;
  }

  const pb = t.closest('.pair button[data-choice]');
  if (pb) {
    const box = pb.closest('.pair');
    box.querySelectorAll('button').forEach(b => b.classList.remove('on'));
    pb.classList.add('on');
    box.dataset.answer = pb.dataset.choice;
    box.classList.add('answered');            // so a glance shows what is left, not just a count
    const form = $('#pairform');
    const btn = form.querySelector('[data-count]');
    const done = form.querySelectorAll('.pair[data-answer]').length;
    const total = form.querySelectorAll('.pair').length;
    btn.disabled = done === 0;
    btn.textContent = btn.dataset.count.replace('{n}', done);
    const bar = form.querySelector('.pairprog i');
    if (bar) bar.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
    return;
  }

  const vb = t.closest('.acts button[data-v]');
  if (vb) {
    const w = vb.closest('.acts'), pmid = w.dataset.pmid;
    const v = w.dataset.verdict === vb.dataset.v ? '' : vb.dataset.v;
    w.dataset.verdict = v;
    w.querySelectorAll('button[data-v]').forEach(b => b.classList.toggle('on', !!v && b.dataset.v === v));
    w.closest('.card')?.classList.toggle('dis', v === 'dislike');
    const a = findArticle(pmid);
    if (v) {
      /* predScale records the divisor in force when this prediction was made. The pool
         calibration() draws on already spans more than one scale — a Claude-reranked
         issue writes Claude's 0-100 into the same field — so this is not corrected here;
         it is recorded so that it can be. */
      USER.feedback[pmid] = { verdict: v, ts: new Date().toISOString(), title: a.title,
        journal: a.journalName || a.journal, predicted: finalScore(a),
        predScale: USER.run?.scaleMax,
        text: [a.title, a.abstract, (a.keywords || []).join(' '), (a.mesh || []).join(' ')].join(' ') };
    } else delete USER.feedback[pmid];
    relearn(USER); saveUser();
    const st = w.querySelector('.st');
    st.textContent = v ? 'saved' : 'cleared'; st.classList.add('show');
    setTimeout(() => st.classList.remove('show'), 1600);
    return;
  }

  const sb = t.closest('.acts button.sv');
  if (sb) {
    const w = sb.closest('.acts'), pmid = w.dataset.pmid, on = !w.dataset.saved;
    w.dataset.saved = on ? '1' : '';
    sb.classList.toggle('on', on);
    sb.textContent = on ? '📖 Saved' : '📖 Read later';
    w.closest('.card')?.classList.toggle('sav', on);
    const a = findArticle(pmid);
    if (on) {
      USER.library[pmid] = { pmid, title: a.title, journalName: a.journalName || a.journal,
        authors: (a.authors || []).slice(0, 6), url: a.url, score: finalScore(a),
        blurb: a.blurb || '', savedAt: new Date().toISOString() };
    } else delete USER.library[pmid];
    saveUser();
    syncCounts();
    return;
  }

  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'scan') return doScan();
  if (act === 'rerank') return doRerank();
  if (act === 'export') { exportProfile(); toast('Exported. Keep the file somewhere you will find it.'); return go(currentView()); }
  if (act === 'snooze') {
    USER.exportSnooze = new Date(Date.now() + SNOOZE_FOR).toISOString();
    saveUser();
    toast('Reminder paused for 3 days.');
    return go(currentView());
  }
  if (act === 'savekey') {
    const v = $('#apikey').value.trim();
    if (!v) return toast('Paste a key first.');
    lsSet('anthropicKey', v); toast('Key saved in this browser.'); return go('settings');
  }
  if (act === 'clearkey') { lsSet('anthropicKey', ''); toast('Key removed.'); return go('settings'); }

  const th = t.closest('[data-settheme]');
  if (th) { lsSet('theme', th.dataset.settheme); applyTheme(); return go(currentView()); }
});

document.addEventListener('submit', e => {
  const form = e.target;
  e.preventDefault();
  if (form.id === 'multi') {
    const vals = [...form.querySelectorAll('.pick.multi.on')].map(p => p.dataset.val);
    const next = form.dataset.next;
    if (next === 'subtopics') {
      USER.specialties = vals;
      const valid = new Set();
      for (const sid of vals) {
        const s = DATA.taxonomy.specialties.find(x => x.id === sid);
        if (s) for (const st of s.subtopics) valid.add(sid + ':' + st.id);
      }
      USER.subtopics = USER.subtopics.filter(k => valid.has(k));
      pruneTiers(USER);
      USER.step = 'subtopics';
    } else if (next === 'pairs') {
      if (!vals.length) return toast('Pick at least one subtopic.');
      // Order no longer carries meaning — interest lives in USER.tiers — so DOM order is fine.
      USER.subtopics = vals;
      pruneTiers(USER);
      USER.step = 'pairs';
    } else if (next === 'ready') {
      if (!vals.length) return toast('Pick at least one journal.');
      USER.journals = vals; USER.step = 'ready'; saveUser();
      return doScan();
    }
    saveUser();
    return go(USER.step);
  }
  if (form.id === 'pairform') {
    const tally = {};
    form.querySelectorAll('.pair').forEach(b => {
      const ans = b.dataset.answer;
      if (!ans) return;
      const ax = b.dataset.axis;
      tally[ax] = tally[ax] || [0, 0];
      if (ans === 'low') tally[ax][0] -= 1;
      else if (ans === 'high') tally[ax][0] += 1;
      tally[ax][1] += 1;
    });
    const scores = {};
    for (const [ax, [total, n]] of Object.entries(tally)) {
      if (n) scores[ax] = +Math.max(-1, Math.min(1, total / n)).toFixed(3);
    }
    // Keep the stated answers untouched as the prior; axisScores is prior + what thumbs
    // have taught since, recomputed from scratch so drift never compounds on itself.
    USER.axisPrior = { ...scores };
    USER.axisScores = scores;
    relearnAxes(USER);
    USER.step = 'journals'; saveUser();
    return go('journals');
  }
});

document.addEventListener('input', e => {
  if (e.target.id !== 'jsearch') return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#jbrowse .pick').forEach(p => {
    p.style.display = !q || (p.dataset.search || '').includes(q) ? '' : 'none';
  });
});

document.addEventListener('change', async e => {
  if (e.target.id === 'importfile' && e.target.files[0]) {
    try { USER = await importProfile(e.target.files[0]); toast('Profile restored.'); go(USER.step === 'ready' ? 'feed' : 'onboard'); }
    catch (err) { toast('Import failed: ' + err.message); }
  }
});

/* -------------------------------------------------------------------- boot */

(async function boot() {
  applyTheme();          // before first paint, so there's no flash of the wrong palette
  // Gates the "Share…" item: no point offering a native sheet the browser will not open.
  if (navigator.share) document.documentElement.classList.add('can-share');
  try {
    DATA = window.__YJ_DATA__;
  } catch (e) {
    $('#app').innerHTML = `<div class="wrap"><h1>Couldn't load data</h1>
      <div class="sub">${esc(e.message)}. If you opened this file directly, serve it over http
      (<code>python3 -m http.server</code>) — browsers block fetch on file:// URLs.</div></div>`;
    return;
  }
  const active = lsGet('active', null);
  USER = active ? loadProfile(active) : null;
  go(USER ? (USER.step === 'ready' ? 'feed' : 'onboard') : 'pick');
})();

</script>
</body>
</html>
