<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Journal</title>
<meta name="description" content="A weekly feed of new medical research, ranked for your interests. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
<style>
:root{--bg:#faf9f6;--fg:#1b1a18;--mut:#6f6a63;--card:#fff;--line:#e3ded5;--acc:#7a4b2a;
--hi:#f2ede4;--up:#2f6b45;--upbg:#e4f0e8;--dn:#8a3b32;--dnbg:#f7e7e4;--star:#a8801c;--starbg:#f8f0d9;
--rule:#cfc7ba}
@media(prefers-color-scheme:dark){:root{--bg:#14140f;--fg:#eae5db;--mut:#9d968b;--card:#1e1d18;
--line:#33302a;--acc:#d9a273;--hi:#25231d;--up:#7fc39a;--upbg:#1d2f24;--dn:#e0897c;--dnbg:#2f1f1c;
--star:#e0b95c;--starbg:#2b2416;--rule:#403c34}}
:root[data-theme=dark]{--bg:#14140f;--fg:#eae5db;--mut:#9d968b;--card:#1e1d18;--line:#33302a;
--acc:#d9a273;--hi:#25231d;--up:#7fc39a;--upbg:#1d2f24;--dn:#e0897c;--dnbg:#2f1f1c;
--star:#e0b95c;--starbg:#2b2416;--rule:#403c34}
:root[data-theme=light]{--bg:#faf9f6;--fg:#1b1a18;--mut:#6f6a63;--card:#fff;--line:#e3ded5;
--acc:#7a4b2a;--hi:#f2ede4;--up:#2f6b45;--upbg:#e4f0e8;--dn:#8a3b32;--dnbg:#f7e7e4;
--star:#a8801c;--starbg:#f8f0d9;--rule:#cfc7ba}
:root[data-theme=sepia]{--bg:#f4ecd8;--fg:#3b2f21;--mut:#7c6a52;--card:#fbf5e6;--line:#ddd0b4;
--acc:#8a5a2b;--hi:#ece0c6;--up:#4a6b3a;--upbg:#e2ebd6;--dn:#9a4432;--dnbg:#f2ddd6;
--star:#9a7a1c;--starbg:#f0e6c8;--rule:#c9b998}
:root[data-theme=slate]{--bg:#11151a;--fg:#dde5ee;--mut:#8e9bab;--card:#1a2029;--line:#2c3642;
--acc:#7fb3e0;--hi:#1f2732;--up:#6fc2a0;--upbg:#16302a;--dn:#e08b8b;--dnbg:#33201f;
--star:#d8b46a;--starbg:#2b2517;--rule:#3a4552}
:root[data-theme=contrast]{--bg:#000;--fg:#fff;--mut:#c9c9c9;--card:#0b0b0b;--line:#5a5a5a;
--acc:#ffd166;--hi:#1a1a1a;--up:#5ee08a;--upbg:#03260f;--dn:#ff8f80;--dnbg:#2b0d09;
--star:#ffd166;--starbg:#2a2205;--rule:#6b6b6b}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 ui-serif,Georgia,"Times New Roman",serif;
margin:0;padding:0 1.25rem 6rem}
.wrap{max-width:54rem;margin:0 auto}
.wide{max-width:66rem}
a{color:var(--acc)}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
padding:.85rem 0 .75rem;margin-bottom:1.8rem;z-index:9}
nav .in{max-width:66rem;margin:0 auto;display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
nav .brand{font:700 15px ui-serif,Georgia,serif;letter-spacing:-.01em;margin-right:.9rem;
color:var(--fg);text-decoration:none}
nav a.tab{font:600 11px ui-sans-serif,system-ui;letter-spacing:.07em;text-transform:uppercase;
color:var(--mut);text-decoration:none;padding:.38rem .65rem;border-radius:6px;
border:1px solid transparent}
nav a.tab:hover{background:var(--hi);color:var(--fg)}
nav a.tab.on{background:var(--hi);color:var(--fg);border-color:var(--line)}
nav .sp{flex:1}
nav .who{font:12px ui-sans-serif,system-ui;color:var(--mut)}
h1{font-size:1.7rem;margin:0 0 .25rem;letter-spacing:-.015em}
h2{font:600 11px/1 ui-sans-serif,system-ui;letter-spacing:.1em;text-transform:uppercase;
color:var(--mut);margin:2.5rem 0 1rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
.sub{color:var(--mut);font:13px/1.55 ui-sans-serif,system-ui;margin-bottom:1.8rem}
.sub b{color:var(--fg)} .sub a{color:var(--acc)}
.btn{font:13px ui-sans-serif,system-ui;background:var(--acc);color:var(--bg);border:0;
border-radius:7px;padding:.62rem 1.15rem;cursor:pointer;font-weight:600;text-decoration:none;
display:inline-block}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--fg);border-color:var(--acc)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:1.6rem}
input[type=text]{font:14px ui-sans-serif,system-ui;background:var(--card);color:var(--fg);
border:1px solid var(--line);border-radius:7px;padding:.6rem .75rem;min-width:16rem}
input[type=text]:focus{outline:0;border-color:var(--acc)}

/* onboarding */
.steps{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.6rem;font:11px ui-sans-serif,system-ui;
letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.steps span{padding:.3rem .6rem;border-radius:99px;border:1px solid var(--line)}
.steps span.on{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
.steps span.done{color:var(--up);border-color:var(--up)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.65rem}
.pick{display:flex;gap:.6rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);
border-radius:10px;padding:.85rem .95rem;cursor:pointer;transition:all .12s;text-align:left;
font:inherit;color:inherit;width:100%}
.pick:hover{border-color:var(--acc)}
.pick.on{border-color:var(--up);background:var(--upbg)}
.pick .ic{font-size:1.15rem;line-height:1.2}
.pick .nm{display:block;font-weight:600;font-size:.97rem}
.pick .ct{display:block;font:12px ui-sans-serif,system-ui;color:var(--mut);margin-top:.15rem}
.pick.on .ct{color:var(--up)}
.grp{margin-bottom:1.8rem}
.grp h3{font:600 13px ui-sans-serif,system-ui;margin:0 0 .6rem;color:var(--fg)}
.pair{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:.85rem 1rem .7rem;margin-bottom:.7rem;transition:border-color .12s}
/* Answered cards recede, so what is left to do is what stands out. */
.pair.answered{border-color:var(--up);background:var(--hi)}
.pair .ax{display:flex;align-items:center;gap:.5rem;
font:10px ui-sans-serif,system-ui;letter-spacing:.09em;text-transform:uppercase;
color:var(--mut);margin-bottom:.55rem}
.pair .qn{display:inline-grid;place-items:center;width:1.15rem;height:1.15rem;flex:0 0 auto;
border:1px solid var(--line);border-radius:50%;font-size:9px;letter-spacing:0}
.pair.answered .qn{border-color:var(--up);color:var(--up)}
.pair .opts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.pair button{font:inherit;font-size:.92rem;line-height:1.4;background:var(--bg);color:var(--fg);
border:1px solid var(--line);border-radius:9px;padding:.7rem .85rem;cursor:pointer;text-align:left;
transition:all .12s}
.pair button:hover{border-color:var(--acc)}
.pair button.on{border-color:var(--up);background:var(--upbg)}
/* One pill, centred — not two full-width buttons competing with the real choice above. */
.pair .skip{display:flex;justify-content:center;margin-top:.45rem}
.pair .skip button{flex:0 0 auto;text-align:center;font:12px ui-sans-serif,system-ui;
padding:.25rem .8rem;border-radius:999px;border-color:transparent;background:none;color:var(--mut)}
.pair .skip button:hover{border-color:var(--line);color:var(--fg)}
.pair .skip button.on{border-color:var(--up);background:var(--upbg);color:var(--fg)}
.pairprog{flex:1;min-width:4rem;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.pairprog i{display:block;height:100%;background:var(--up);width:0;transition:width .18s}
@media(max-width:620px){.pair .opts{grid-template-columns:1fr}}

/* article cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.05rem 1.2rem;
margin-bottom:.85rem;transition:opacity .18s}
.card.dis{opacity:.45}
.card.sav{border-color:var(--star)}
.top{display:flex;gap:.8rem;align-items:baseline}
.rk{font:600 13px ui-sans-serif,system-ui;color:var(--mut);min-width:1.5rem}
.sc{font:700 15px ui-sans-serif,system-ui;color:var(--acc);min-width:2.3rem;text-align:right}
.ti{font-size:1.02rem;font-weight:600;line-height:1.4;flex:1}
.ti a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.ti a:hover{border-color:var(--acc)}
.ind{margin-left:4.7rem}
.meta{font:12px ui-sans-serif,system-ui;color:var(--mut);margin-top:.45rem}
.meter{height:3px;background:var(--line);border-radius:2px;margin-top:.7rem;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.tag{display:inline-block;font:11px ui-sans-serif,system-ui;background:var(--hi);color:var(--mut);
border:1px solid var(--line);border-radius:99px;padding:.14rem .55rem;margin:.28rem .3rem 0 0}
.acts{display:flex;gap:.35rem;margin-top:.7rem;align-items:center;flex-wrap:wrap}
.acts button{font:15px/1 ui-sans-serif,system-ui;background:transparent;color:var(--mut);
border:1px solid var(--line);border-radius:7px;padding:.34rem .6rem;cursor:pointer;
transition:all .13s;opacity:.55}
.acts button:hover{opacity:1;border-color:var(--acc)}
.acts button.on{opacity:1}
.acts button.on[data-v=love],.acts button.on[data-v=like]{background:var(--upbg);border-color:var(--up)}
.acts button.on[data-v=dislike]{background:var(--dnbg);border-color:var(--dn)}
.acts button.sv.on{background:var(--starbg);border-color:var(--star);color:var(--star)}
.acts .st{font:11px ui-sans-serif,system-ui;color:var(--mut);margin-left:.3rem;opacity:0;
transition:opacity .2s}
.acts .st.show{opacity:1}
.empty{color:var(--mut);font:14px ui-sans-serif,system-ui;padding:3.5rem 0;text-align:center}
.note{background:var(--hi);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;
font:13px/1.6 ui-sans-serif,system-ui;color:var(--mut);margin-top:2.2rem}
.note b{color:var(--fg)}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:.9rem;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}

/* newspaper */
.paper{max-width:64rem;margin:0 auto}
.masthead{text-align:center;border-bottom:3px double var(--rule);padding:1.4rem 0 .9rem;
margin-bottom:.5rem}
.masthead h1{font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:-.02em;margin:0;font-weight:700}
.masthead .dek{font:11px ui-sans-serif,system-ui;letter-spacing:.28em;text-transform:uppercase;
color:var(--mut);margin-top:.5rem}
.rule{border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;
font:11px ui-sans-serif,system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
padding:.5rem 0;margin-bottom:1.6rem}
.lead{border-bottom:1px solid var(--rule);padding-bottom:1.5rem;margin-bottom:1.5rem}
.lead .kick{font:11px ui-sans-serif,system-ui;letter-spacing:.16em;text-transform:uppercase;
color:var(--acc);font-weight:700;margin-bottom:.5rem}
.lead h3{font-size:clamp(1.5rem,3.4vw,2.15rem);line-height:1.16;margin:0 0 .6rem;
letter-spacing:-.015em;font-weight:700}
.lead h3 a{color:inherit;text-decoration:none}
.lead h3 a:hover{color:var(--acc)}
.lead .byline{font:12px ui-sans-serif,system-ui;color:var(--mut);margin-bottom:.8rem;
text-transform:uppercase;letter-spacing:.06em}
.lead .body{columns:2;column-gap:2.2rem;font-size:1rem;line-height:1.6;text-align:justify;
hyphens:auto}
.lead .body p{margin:0}
.lead .body::first-letter{float:left;font-size:3.1rem;line-height:.82;padding:.1rem .5rem .1rem 0;
font-weight:700;color:var(--acc)}
.cols{columns:3;column-gap:2rem}
.cols.two{columns:2;column-gap:2.4rem}
.story{break-inside:avoid;padding-bottom:1.1rem;margin-bottom:1.1rem;
border-bottom:1px solid var(--line)}
.story h4{font-size:1.05rem;line-height:1.3;margin:0 0 .35rem;font-weight:700;letter-spacing:-.005em}
.story h4 a{color:inherit;text-decoration:none}
.story h4 a:hover{color:var(--acc)}
.story .src{font:10px ui-sans-serif,system-ui;letter-spacing:.09em;text-transform:uppercase;
color:var(--mut);margin-bottom:.4rem}
.story .dek{font-size:.9rem;line-height:1.5;color:var(--fg);text-align:justify;hyphens:auto}
.story .scr{float:right;font:700 11px ui-sans-serif,system-ui;color:var(--acc);
border:1px solid var(--line);border-radius:99px;padding:.05rem .4rem;margin-left:.4rem}
.secthead{font:700 11px ui-sans-serif,system-ui;letter-spacing:.16em;text-transform:uppercase;
color:var(--fg);border-top:2px solid var(--rule);border-bottom:1px solid var(--line);
padding:.4rem 0;margin:0 0 1rem}
.papernote{border-top:3px double var(--rule);margin-top:2rem;padding-top:1rem;
font:12px/1.6 ui-sans-serif,system-ui;color:var(--mut);text-align:center}
@media(max-width:900px){.cols{columns:2}}
@media(max-width:620px){.cols{columns:1}.lead .body{columns:1}}
@media(max-width:600px){.ind{margin-left:0}}

/* --- web-app additions --- */
.pick.multi{cursor:pointer}
.hint{font:12px ui-sans-serif,system-ui;color:var(--mut)}
.cols.two{columns:2}
input[type=password]{font:14px ui-monospace,Menlo,monospace;background:var(--card);color:var(--fg);
border:1px solid var(--line);border-radius:7px;padding:.6rem .75rem;min-width:20rem}
input[type=password]:focus{outline:0;border-color:var(--acc)}
input[type=file]{font:13px ui-sans-serif,system-ui;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%);background:var(--fg);
color:var(--bg);font:13px ui-sans-serif,system-ui;padding:.6rem 1.1rem;border-radius:8px;
opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:.95}
nav .brand{cursor:pointer}
nav a.tab,nav .who a{cursor:pointer}
.note a,.sub a,.empty a{cursor:pointer}
code{font:12px ui-monospace,Menlo,monospace;background:var(--hi);border:1px solid var(--line);
border-radius:4px;padding:.1rem .35rem}
@media(max-width:620px){.cols.two{columns:1}input[type=password]{min-width:100%}}

/* export reminder */
.banner{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;justify-content:space-between;
background:var(--starbg);border:1px solid var(--star);border-radius:10px;
padding:.9rem 1.1rem;margin:0 0 1.8rem;font:13px/1.55 ui-sans-serif,system-ui;color:var(--fg)}
.banner b{color:var(--fg)}
.banner .acts-row{display:flex;gap:.5rem;flex-shrink:0}
.banner .btn{padding:.45rem .85rem;font-size:12px}
@media(max-width:600px){.banner{flex-direction:column;align-items:flex-start}}

/* ============ v2: tutorial, To Read Later, journal browser, paper sections ============ */

/* multi-select affordance — a real checkbox so "select many" is obvious */
.pick{position:relative}
.pick .box{flex:0 0 auto;width:15px;height:15px;margin-top:.18rem;border:1.5px solid var(--line);
border-radius:4px;background:var(--bg);transition:all .12s;position:relative}
.pick.on .box{background:var(--up);border-color:var(--up)}
.pick.on .box::after{content:"✓";position:absolute;inset:0;color:var(--bg);font:700 11px/15px
ui-sans-serif,system-ui;text-align:center}
.linkbtn{background:none;border:0;color:var(--acc);font:12px ui-sans-serif,system-ui;cursor:pointer;
padding:0 .35rem;text-decoration:underline;font-weight:500}
.grp h3{display:flex;align-items:baseline;gap:.2rem;flex-wrap:wrap}
.sticky-row{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 62%,transparent);
padding:1rem 0 1.1rem;margin-top:1.2rem;z-index:6}

/* journal browser */
#jsearch{font:14px ui-sans-serif,system-ui;background:var(--card);color:var(--fg);
border:1px solid var(--line);border-radius:7px;padding:.6rem .8rem;width:100%;max-width:26rem;
margin-bottom:.9rem}
#jsearch:focus{outline:0;border-color:var(--acc)}
.jbrowse{max-height:30rem;overflow-y:auto;padding:.3rem;border:1px solid var(--line);
border-radius:10px;background:var(--bg)}

/* To Read Later strip */
.trl{background:var(--starbg);border:1px solid var(--star);border-radius:10px;
padding:.7rem 1rem;margin-bottom:1.6rem;font:13px ui-sans-serif,system-ui}
.trl summary{cursor:pointer;font-weight:700;color:var(--fg);list-style:none;display:flex;
align-items:baseline;gap:.6rem}
.trl summary::-webkit-details-marker{display:none}
.trl summary::before{content:"▸";color:var(--star);transition:transform .15s;display:inline-block}
.trl[open] summary::before{transform:rotate(90deg)}
.trl ul{list-style:none;margin:.7rem 0 .1rem;padding:0}
.trl li{display:flex;gap:.6rem;align-items:baseline;padding:.35rem 0;border-top:1px solid var(--line)}
.trl li a{color:var(--fg);text-decoration:none;flex:1;font-size:13px;line-height:1.45}
.trl li a:hover{color:var(--acc)}
.trl li .src{font:11px ui-sans-serif,system-ui;color:var(--mut);white-space:nowrap}
.unsave{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;padding:0 .2rem}
.unsave:hover{color:var(--dn)}

/* tutorial */
.how-step{display:flex;gap:1.1rem;align-items:flex-start;margin-bottom:2.2rem}
.how-n{flex:0 0 auto;width:2rem;height:2rem;border-radius:50%;background:var(--acc);color:var(--bg);
font:700 14px/2rem ui-sans-serif,system-ui;text-align:center}
.how-step h3{font:600 1.05rem ui-serif,Georgia,serif;margin:.15rem 0 .5rem;color:var(--fg)}
.how-step p{font:14px/1.62 ui-sans-serif,system-ui;color:var(--mut);margin:0 0 .7rem}
.how-step b{color:var(--fg)}
.how-table{border-collapse:collapse;margin:.4rem 0 .9rem;font:13px/1.5 ui-sans-serif,system-ui}
.how-table td{padding:.4rem .8rem .4rem 0;vertical-align:top;color:var(--mut);
border-bottom:1px solid var(--line)}
.how-table td:first-child{font-size:1rem;white-space:nowrap}
.how-table b{color:var(--fg)}

/* API-key instructions */
.keyhelp{background:var(--hi);border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem;
margin:.4rem 0 1rem;font:13px/1.6 ui-sans-serif,system-ui;color:var(--mut)}
.keyhelp summary{cursor:pointer;font-weight:600;color:var(--fg)}
.keyhelp ol{margin:.8rem 0 .6rem;padding-left:1.2rem}
.keyhelp li{margin-bottom:.5rem}
.keyhelp b{color:var(--fg)}
.keyhelp p{margin:.7rem 0 0}

/* The Paper — section landmarks and varied story sizes */
.psec{margin-bottom:2.4rem}
.secthead{display:flex;justify-content:space-between;align-items:baseline;
font:700 11px ui-sans-serif,system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--fg);
border-top:3px double var(--rule);border-bottom:1px solid var(--line);padding:.5rem 0;margin:0 0 1.1rem}
.secthead .secn{font-weight:400;color:var(--mut);letter-spacing:.04em}
.secthead span:first-child{flex:1;min-width:0}
/* A Core section is announced, not just ordered first — the heading is heavier, the accent
   rule replaces the hairline, and the whole band is inset so it reads as a major department. */
.psec.core .secthead{font-size:12px;color:var(--acc);border-top-color:var(--acc);
border-bottom-color:var(--acc)}
.psec.core{padding-left:.9rem;border-left:2px solid var(--acc);margin-left:-.9rem}
.tchip{font:700 9px ui-sans-serif,system-ui;letter-spacing:.12em;text-transform:uppercase;
color:var(--bg);background:var(--acc);border-radius:3px;padding:.1rem .35rem;flex:0 0 auto}

/* contents strip */
.contents{display:flex;flex-wrap:wrap;gap:.45rem .9rem;align-items:baseline;
padding:.7rem 0 .8rem;margin-bottom:1.4rem;border-bottom:1px solid var(--rule);
font:11px ui-sans-serif,system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.contents b{color:var(--fg);letter-spacing:.16em}
.citem i{font-style:normal;color:var(--mut);margin-left:.3rem;font-variant-numeric:tabular-nums}
.citem.core{color:var(--acc);font-weight:700}

.seconds{display:grid;grid-template-columns:1fr 1fr;gap:2.2rem;padding-bottom:1.6rem;
margin-bottom:1.8rem;border-bottom:1px solid var(--rule)}
.story.big h4{font-size:1.28rem;line-height:1.22}
.story.big .dek{font-size:.97rem}
.story.small h4{font-size:1.02rem}
/* The tail of the issue: still readable, deliberately quieter than the departments above it. */
.story.tiny{padding-bottom:.8rem;margin-bottom:.8rem}
.story.tiny h4{font-size:.94rem;line-height:1.28;font-weight:600}
.story.tiny .dek{font-size:.84rem;line-height:1.45;color:var(--mut);text-align:left;hyphens:none}
.story.tiny .badges{display:none}
/* A section holding one story gets the full measure rather than a lone column with a gap. */
.cols.one{columns:1}
.cols.one .story{max-width:44rem}
.storyfoot{display:flex;align-items:center;gap:.6rem;margin-top:.55rem;flex-wrap:wrap}
.storyfoot .scr{float:none;margin:0}
.paper-sv{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--mut);
font:11px ui-sans-serif,system-ui;padding:.2rem .5rem;cursor:pointer;transition:all .12s}
.paper-sv:hover{border-color:var(--star);color:var(--star)}
.paper-sv.on{background:var(--starbg);border-color:var(--star);color:var(--star);font-weight:600}
.lead .storyfoot{margin-top:1rem}
.blurb.dim{color:var(--mut)}
@media(max-width:760px){.seconds{grid-template-columns:1fr;gap:1.4rem}}
/* The Core band is inset by a negative margin on wide screens, where .paper has room to
   spare. Narrow ones do not, so it would hang off the edge — keep the rule, drop the inset. */
@media(max-width:720px){
  .psec.core{margin-left:0;padding-left:.7rem}
  .contents{gap:.35rem .7rem}
}

/* profile chooser */
.pickgrid .pick{flex-direction:column;gap:.15rem;text-align:left}
/* profile rows + delete */
.pickrow{display:flex;gap:.4rem;align-items:stretch}
.pickrow .pick{flex:1;min-width:0}
.delprof{flex:0 0 auto;background:transparent;border:1px solid var(--line);border-radius:9px;
color:var(--mut);cursor:pointer;font:14px ui-sans-serif,system-ui;padding:0 .7rem;opacity:.5;
transition:all .13s}
.delprof:hover{opacity:1;color:var(--dn);border-color:var(--dn);background:var(--dnbg)}
.pickrow.danger{flex-direction:column;gap:.7rem;background:var(--dnbg);border:1px solid var(--dn);
border-radius:10px;padding:.9rem 1rem}
.delmsg b{display:block;font-size:.97rem;margin-bottom:.2rem}
.delacts{display:flex;gap:.5rem;flex-wrap:wrap}
.delacts .btn{margin:0}
.btn.danger{background:var(--dn);border-color:var(--dn);color:var(--bg)}
.btn.danger:hover{opacity:.88}

/* share */
.sharewrap{position:relative;display:inline-flex}
.sharemenu{position:absolute;bottom:calc(100% + .3rem);left:0;z-index:20;display:flex;
flex-direction:column;min-width:9.5rem;background:var(--card);border:1px solid var(--line);
border-radius:9px;padding:.25rem;box-shadow:0 6px 22px rgba(0,0,0,.22)}
.sharemenu[hidden]{display:none}
.sharemenu button{display:block;width:100%;text-align:left;background:none;border:0;
border-radius:6px;color:var(--fg);cursor:pointer;font:13px ui-sans-serif,system-ui;
padding:.45rem .6rem;opacity:1}
.sharemenu button:hover{background:var(--hi)}
.nativeonly{display:none}
:root.can-share .sharemenu .nativeonly{display:block}
.newrow{display:flex;gap:.5rem;align-items:center;margin:.5rem 0 1rem;flex-wrap:wrap}
.newrow input{flex:1 1 14rem;min-width:0;background:var(--card);border:1px solid var(--line);
  color:var(--fg);border-radius:7px;padding:.55rem .7rem;font:inherit;font-size:.95rem}
.newrow input:focus{outline:none;border-color:var(--acc)}

/* ---- reaction emoji ------------------------------------------------------
   The stock 👍 renders bright yellow and out-shouts the headline it sits under.
   Desaturate the emoji and let the button's border and background carry state.
   ★ is a text glyph coloured by var(--star), so it must NOT be filtered. */
.acts button[data-v],.acts button.sv,.paper-sv.sv,.trl .sv{filter:grayscale(1)}
.acts button[data-v].on,.acts button.sv.on{filter:grayscale(.45)}

/* ---- favourites ---------------------------------------------------------- */
.acts button.fav{color:var(--mut)}
.acts button.fav.on{background:var(--starbg);border-color:var(--star);color:var(--star);opacity:1}
.card.favd{border-left:3px solid var(--star)}
.story .fav{margin-left:.25rem}
.story .fav.on{color:var(--star)}

/* ---- subtopic interest tiers --------------------------------------------- */
.rankbox{background:var(--hi);border:1px solid var(--line);border-radius:10px;
padding:.85rem 1rem;margin:0 0 1.4rem}
.rankhead{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;
font:13px ui-sans-serif,system-ui}
.rankhead .hint{color:var(--mut);font-size:12px}
.tgrp{margin-top:.9rem}
.thead{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;
font:13px ui-sans-serif,system-ui;padding-left:.15rem}
.thead .hint{color:var(--mut);font-size:12px}
.thead .tw{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
/* A left rule shows three buckets as three bands without three background colours
   fighting the card palette underneath. */
.tgrp .ranklist{border-left:2px solid var(--line);padding-left:.5rem;margin-top:.35rem}
.tgrp.t-core .ranklist{border-left-color:var(--acc)}
.ranklist{list-style:none;margin:.7rem 0 0;padding:0;display:flex;flex-direction:column;gap:.18rem}
.ranklist li{display:flex;gap:.55rem;align-items:center;background:var(--card);
border:1px solid var(--line);border-radius:7px;padding:.3rem .55rem;
font:13px ui-sans-serif,system-ui}
.ranklist .rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ranklist .linkbtn{padding:.1rem .3rem;font-size:12px}
.ranklist .linkbtn.drop:hover{color:var(--dn)}
/* Segmented control: all three states always visible, so setting a tier is one click and
   the current one is readable without a legend. */
.tset{display:flex;flex:0 0 auto;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tset .tbtn{background:none;border:0;border-right:1px solid var(--line);cursor:pointer;
color:var(--mut);padding:.18rem .45rem;font:11px ui-sans-serif,system-ui;white-space:nowrap}
.tset .tbtn:last-child{border-right:0}
.tset .tbtn:hover{background:var(--hi);color:var(--fg)}
.tset .tbtn.on{background:var(--acc);color:var(--bg);font-weight:600}
@media(max-width:560px){
  .ranklist li{flex-wrap:wrap}
  .ranklist .rname{flex:1 0 100%}
}

/* ---- past issues --------------------------------------------------------- */
.isslist{list-style:none;margin:1rem 0 0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.issrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:.5rem 1rem;align-items:baseline;
background:var(--card);border:1px solid var(--line);border-radius:9px;padding:.7rem .9rem;
font:13px ui-sans-serif,system-ui}
.issrow[data-openissue]{cursor:pointer}
.issrow[data-openissue]:hover{border-color:var(--acc)}
.isdate{font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
/* The lead title is the only part that says what the issue *was*, so it gets the free space
   and is the thing that truncates rather than wraps the row into three lines. */
.islead{color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ismeta{color:var(--mut);font-size:12px;white-space:nowrap}
.isgo{color:var(--acc);font-size:12px;white-space:nowrap}
@media(max-width:680px){
  .issrow{grid-template-columns:1fr auto}
  .islead{grid-column:1/-1;white-space:normal}
}

/* ---- theme picker -------------------------------------------------------- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.5rem;
margin:.6rem 0 1rem}
.themes button{display:flex;gap:.55rem;align-items:center;text-align:left;cursor:pointer;
background:var(--card);border:1px solid var(--line);border-radius:9px;padding:.55rem .65rem;
color:var(--fg);font:inherit;font-size:.9rem}
.themes button:hover{border-color:var(--acc)}
.themes button.on{border-color:var(--up);background:var(--upbg)}
.themes .sw{flex:0 0 auto;width:2.1rem;height:1.5rem;border-radius:5px;border:1px solid var(--line);
display:flex;overflow:hidden}
.themes .sw i{flex:1}
.themes .tn{display:block;font-weight:600;line-height:1.25}
.themes .td{display:block;font:11px ui-sans-serif,system-ui;color:var(--mut)}

/* ---- "is it working?" panel ---------------------------------------------- */
.calib{display:flex;gap:1.1rem;align-items:flex-start;background:var(--hi);
border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:10px;
padding:1rem 1.2rem;margin:.6rem 0 1.4rem}
.calib.good{border-left-color:var(--up)}
.calib.ok{border-left-color:var(--acc)}
.calib.weak{border-left-color:var(--star)}
.calib.bad{border-left-color:var(--dn)}
.calib .cbig{font:700 2.5rem/1 ui-serif,Georgia,serif;flex:0 0 auto;letter-spacing:-.02em}
.calib .cbig span{font-size:1.1rem;color:var(--mut);margin-left:.06em}
.calib.good .cbig{color:var(--up)}
.calib.ok .cbig{color:var(--acc)}
.calib.weak .cbig{color:var(--star)}
.calib.bad .cbig{color:var(--dn)}
.calib .cbody{flex:1;min-width:0;font:13px ui-sans-serif,system-ui}
.calib .hint{display:block;color:var(--mut);font-size:12px;margin-top:.3rem}
.cbars{margin:.6rem 0 .1rem;display:flex;flex-direction:column;gap:.3rem}
.cbars div{display:flex;align-items:center;gap:.5rem;font:12px ui-sans-serif,system-ui}
.cbars .cl{flex:0 0 6.5rem;color:var(--mut)}
.cbars i{height:.5rem;border-radius:99px;background:var(--up);min-width:2px}
.cbars i.lo{background:var(--dn)}
.cbars b{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:600}
.chip{display:inline-block;font:10px ui-sans-serif,system-ui;letter-spacing:.04em;
text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:99px;
padding:.05rem .45rem;margin-left:.35rem;vertical-align:.08em}
.chip.learned{color:var(--acc);border-color:var(--acc)}
@media(max-width:620px){.calib{flex-direction:column;gap:.5rem}}

/* ---- practice-changing / journal-standing badges -------------------------- */
.badges{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.5rem}
.badge{display:inline-block;font:600 10px ui-sans-serif,system-ui;letter-spacing:.06em;
text-transform:uppercase;border-radius:99px;padding:.14rem .5rem;border:1px solid var(--line);
color:var(--mut);white-space:nowrap}
.badge.pc{color:var(--up);border-color:var(--up)}
.badge.pc.hi{background:var(--upbg);color:var(--up);border-color:var(--up)}
.badge.flagship{background:var(--starbg);color:var(--star);border-color:var(--star)}
.badge.leading{color:var(--acc);border-color:var(--acc)}
.story .badges{margin:.35rem 0 .1rem}
.story .badge{font-size:9px;padding:.1rem .4rem}

/* ---- starved-subtopic picks ---------------------------------------------- */
.starved{position:relative;margin-bottom:.85rem}
.starved .slabel{display:inline-block;font:600 10px ui-sans-serif,system-ui;letter-spacing:.07em;
text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);border-radius:99px;
padding:.1rem .5rem;margin-bottom:.35rem}
.starved .card{margin-bottom:0}
.starved .rk{color:var(--acc)}

/* ---- the wait ------------------------------------------------------------ */
.waitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.7rem}
.waitcard{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:.9rem 1.05rem;font:13px/1.55 ui-sans-serif,system-ui}
.waitcard .wn{font:600 10px ui-sans-serif,system-ui;letter-spacing:.09em;text-transform:uppercase;
color:var(--mut);margin-bottom:.45rem}
.waitcard p{margin:0 0 .5rem}
.waitcard p:last-child{margin-bottom:0}
.waitcard .hint{color:var(--mut);font-size:12px}

/* ---- small screens -------------------------------------------------------
   Everything above is fluid or wraps; these are the places where it wraps into
   something worse than it scrolls into, or where a touch target is too small. */

/* Long titles, journal names and pasted URLs are the usual cause of a page that
   scrolls sideways. Break them rather than letting one word set the page width. */
.ti,.ti a,.blurb,.meta,.story h4,.lead h3,.islead,.trl li a,.nm,.rname{overflow-wrap:anywhere}
.grid,.pickgrid,.waitgrid{min-width:0}
.grid>*,.pickgrid>*{min-width:0}

@media(max-width:760px){
  /* Seven tabs wrapped into a three-line sticky bar that ate a third of the screen.
     One scrollable strip keeps it to a single row and stays reachable by thumb. */
  nav .in{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav .in::-webkit-scrollbar{display:none}
  nav .brand{margin-right:.5rem;flex:0 0 auto}
  nav a.tab{flex:0 0 auto}
  nav .sp{display:none}
  nav .who{flex:0 0 auto;padding-left:.5rem}
  .paper .rule{flex-wrap:wrap;gap:.2rem .9rem;justify-content:flex-start}
}

@media(max-width:620px){
  body{padding:0 .9rem 5rem}
  /* 28px was under the thumb-target floor; these are the controls used most. */
  .acts{gap:.3rem}
  .acts button{padding:.5rem .7rem;min-height:2.4rem;opacity:.75}
  .paper-sv{padding:.4rem .6rem;min-height:2.2rem}
  .delprof{min-width:2.6rem}
  /* A popover anchored to a button that may sit anywhere in a wrapped row will clip off
     one edge or the other. On a phone it becomes a sheet, which cannot. */
  .sharemenu{position:fixed;left:.9rem;right:.9rem;bottom:.9rem;top:auto;min-width:0;
  border-radius:12px;padding:.35rem;box-shadow:0 -4px 30px rgba(0,0,0,.3)}
  .sharemenu button{padding:.75rem .8rem;font-size:14px}
  /* min-width in rem overflows a 320px viewport once body padding is taken off. */
  input[type=text],input[type=password]{min-width:0;width:100%}
  .newrow input{flex:1 1 100%}
  .trl li{flex-wrap:wrap}
  .trl li .src{white-space:normal}
  .ismeta{white-space:normal}
  /* Inline left/right from the popover nudge must not fight the sheet layout. */
  .sharemenu{left:.9rem!important;right:.9rem!important}
  .how-table{display:block;overflow-x:auto;max-width:100%}
  .how-table td:first-child{white-space:normal}
  .jbrowse{max-height:22rem}
  .grid{grid-template-columns:1fr}
  .masthead{padding:1rem 0 .7rem}
  .lead .body::first-letter{font-size:2.6rem}
}

<script>
/* Your Journal — static web app.
 *
 * Runs entirely in the browser. PubMed E-utilities is called directly (NCBI sends
 * Access-Control-Allow-Origin: *), so there is no backend and no shared rate-limit
 * pool — each reader spends their own 3 req/s against their own IP.
 *
 * Storage is localStorage, namespaced per profile. Optional: a reader can paste
 * their own Anthropic API key to enable the semantic re-rank pass; the key is kept
 * in their browser and sent only to api.anthropic.com.
 */
'use strict';

const EUTILS = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
const STORE = 'yj:';
const MODEL = 'claude-opus-5';

const VERDICT_W = { love: 2, like: 1, dislike: -1 };
const STOP = new Set(('a an the and or but if of in on at to for with without from by as is are was were be been being ' +
  'this that these those it its their there here we our you your they them he she his her not no than then so such can ' +
  'could may might will would shall should do does did done have has had using use used study studies research results ' +
  'result methods method conclusion conclusions background objective objectives purpose aim aims findings show shows ' +
  'shown showed suggest suggests associated association between among within across during after before significant ' +
  'significantly higher lower increase increased decrease decreased effect effects however also more most less least ' +
  'both each other others all any some new novel first second via versus vs based upon into over under about which who ' +
  'whom whose what when where why how one two three four five patients patient group groups subjects participants data ' +
  'analysis analyses evidence review overview report reports case cases').split(' '));

let DATA = { taxonomy: null, axes: null, journals: null };
let USER = null;

/* ------------------------------------------------------------------ storage */

const lsGet = (k, d) => { try { const v = localStorage.getItem(STORE + k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(STORE + k, JSON.stringify(v)); } catch (e) { toast('Storage full — export your profile.'); } };
const lsDel = k => { try { localStorage.removeItem(STORE + k); } catch (e) { /* nothing to undo */ } };
/* Every key under a prefix, so deleting a profile can sweep issue bodies it may not have an
   index for. Scanning beats trusting the index: a stale one strands megabytes with nothing
   pointing at them, and the quota is the scarce resource here. */
const lsKeys = prefix => {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(STORE + prefix) === 0) out.push(k.slice(STORE.length));
    }
  } catch (e) { /* storage not enumerable */ }
  return out;
};

function listProfiles() { return lsGet('profiles', []); }

function newProfile(name) {
  const id = (name || 'reader').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'reader';
  const profiles = listProfiles();
  const uid = profiles.some(p => p.id === id) ? id + '-' + Math.random().toString(36).slice(2, 6) : id;
  const u = {
    id: uid, name: name || 'Reader', created: new Date().toISOString(),
    step: 'specialties', specialties: [], subtopics: [], tiers: {}, axisScores: {},
    journals: [], feedback: {}, library: {}, favorites: {}, weights: {}, seen: [], run: null,
  };
  profiles.push({ id: uid, name: u.name });
  lsSet('profiles', profiles);
  lsSet('u:' + uid, u);
  lsSet('active', uid);
  return u;
}

function loadProfile(id) {
  const u = lsGet('u:' + id, null);
  if (!u) return null;
  if (!u.favorites) u.favorites = {};        // profiles created before favorites existed
  // Profiles from before axis learning: their answers become the prior they always were.
  if (!u.axisPrior && u.axisScores) u.axisPrior = { ...u.axisScores };
  /* Profiles from before interest tiers carry an ordered subtopic list. Splitting it in
     thirds is the closest honest reading of what that order meant, and it keeps a returning
     reader's top interests on top rather than flattening everyone to Interested. */
  if (!u.tiers && Array.isArray(u.subtopics)) {
    u.tiers = {};
    const cut = Math.ceil(u.subtopics.length / 3);
    u.subtopics.forEach((k, i) => {
      u.tiers[k] = i < cut ? 'core' : i < cut * 2 ? 'interested' : 'occasional';
    });
  }
  return u;
}
function saveUser() { lsSet('u:' + USER.id, USER); }

/* ------------------------------------------------------------------- themes */

/* A display preference, so it lives per-browser rather than per-profile — switching
   readers on a shared laptop shouldn't repaint the screen. 'auto' means: set no
   attribute and let the prefers-color-scheme block decide. */
const THEMES = [
  ['auto',     'Match system', 'Follows your OS light/dark setting', ['#faf9f6', '#14140f']],
  ['light',    'Newsprint',    'Warm paper, dark ink',               ['#faf9f6', '#e3ded5']],
  ['dark',     'Night',        'Warm dark, the current default',     ['#14140f', '#d9a273']],
  ['sepia',    'Sepia',        'Softer, older paper',                ['#f4ecd8', '#8a5a2b']],
  ['slate',    'Slate',        'Cool grey-blue, low glare',          ['#11151a', '#7fb3e0']],
  ['contrast', 'High contrast','Pure black, maximum legibility',     ['#000000', '#ffd166']],
];

function applyTheme(v) {
  const t = v || lsGet('theme', 'auto');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

function themePicker() {
  const cur = lsGet('theme', 'auto');
  return `<div class="themes">` + THEMES.map(([id, name, desc, sw]) =>
    `<button type="button" class="${id === cur ? 'on' : ''}" data-settheme="${id}">
      <span class="sw"><i style="background:${sw[0]}"></i><i style="background:${sw[1]}"></i></span>
      <span><span class="tn">${esc(name)}</span><span class="td">${esc(desc)}</span></span>
    </button>`).join('') + `</div>`;
}

const DAY = 864e5;
const EXPORT_EVERY = 7 * DAY;   // remind once a week
const SNOOZE_FOR = 3 * DAY;     // "not now" buys three days, not silence

/* Archived issues live under their own keys, so a plain dump of USER would quietly leave
   them behind — and the export banner promises a backup. They ride along under _archive and
   are unpacked back into their own keys on import, so the on-disk split is invisible here. */
function exportPayload(u = USER) {
  const index = archIndex(u.id);
  const issues = {};
  for (const m of index) {
    const arts = loadIssue(u.id, m.id);
    if (arts) issues[m.id] = arts;
  }
  return index.length ? { ...u, _archive: { index, issues } } : { ...u };
}

// Takes a profile so the delete confirmation can offer a backup of one that is not active.
function exportProfile(u = USER) {
  u.lastExport = new Date().toISOString();
  delete u.exportSnooze;
  const blob = new Blob([JSON.stringify(exportPayload(u), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `yourjournal-${u.id}-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  lsSet('u:' + u.id, u);
}

/* Deleting a profile has to take its issues with it. They live under their own keys, so
   dropping the row from `profiles` alone would leave the bodies behind forever — invisible,
   unreachable, and still spending the quota that everything else competes for. */
function deleteProfile(id) {
  for (const k of lsKeys('issue:' + id + ':')) lsDel(k);
  lsDel('arch:' + id);
  lsDel('u:' + id);
  lsSet('profiles', listProfiles().filter(p => p.id !== id));
  if (lsGet('active', null) === id) { lsSet('active', null); USER = null; }
}

/* Nag to export, but only when there is something to lose and only once a week.
   A reader who has rated nothing has no state worth backing up, so stay quiet. */
function exportBannerHTML() {
  if (!USER || USER.step !== 'ready') return '';
  const worthLosing = Object.keys(USER.feedback).length + Object.keys(USER.library).length;
  if (worthLosing < 3) return '';

  const now = Date.now();
  if (USER.exportSnooze && now < Date.parse(USER.exportSnooze)) return '';
  const since = Date.parse(USER.lastExport || USER.created || 0);
  if (Number.isFinite(since) && now - since < EXPORT_EVERY) return '';

  const days = Math.floor((now - since) / DAY);
  const never = !USER.lastExport;
  const when = never
    ? `You have never exported this profile`
    : `Last export was ${days} day${days === 1 ? '' : 's'} ago`;
  return `<div class="banner"><div>
    <b>${when}.</b> Your ${worthLosing} ratings and saves live only in this browser —
    clearing site data or switching devices loses them.
    </div><div class="acts-row">
    <button class="btn" data-act="export">Export now</button>
    <button class="btn ghost" data-act="snooze">Not now</button>
    </div></div>`;
}

async function importProfile(file) {
  return applyImportedProfile(JSON.parse(await file.text()));
}

function applyImportedProfile(u) {
  if (!u.id || !Array.isArray(u.subtopics)) throw new Error('Not a Your Journal profile');
  // Unpack archived issues back into their own keys; the profile itself must not carry them.
  const arch = u._archive;
  delete u._archive;
  const profiles = listProfiles().filter(p => p.id !== u.id);
  profiles.push({ id: u.id, name: u.name });
  lsSet('profiles', profiles);
  lsSet('u:' + u.id, u);
  if (arch && Array.isArray(arch.index)) {
    for (const [id, arts] of Object.entries(arch.issues || {})) lsSet(issueKey(u.id, id), arts);
    // Only index issues whose bodies actually made it in, so no row opens onto nothing.
    lsSet(archKey(u.id), arch.index.filter(m => loadIssue(u.id, m.id)));
  }
  lsSet('active', u.id);
  return u;
}

/* ------------------------------------------------------------ issue archive */

/* Issues used to be overwritten: USER.run held one week and the previous one was gone. They
   are now kept, but deliberately NOT inside the profile object.

   lsSet swallows a quota error, and saveUser() writes the whole profile under a single key —
   so a profile fat enough to fail would take every subsequent rating, save and favourite down
   with it, silently, with only a toast. Issues are the one part of the profile that grows
   without bound, so they live under their own keys: a failed archive write costs that issue
   and nothing else.

   They are also slimmed. A real week is ~300 KB, almost all of it abstracts, which fills a
   5 MB quota in about four months — and the 30-day first issue is 1.09 MB on its own. Keeping
   only what the feed actually renders takes a week to ~75 KB. A two-sentence excerpt survives
   so an archived card still has body text rather than a blank where the preview was; `doi` and
   `year` do not, because nothing displays them, and `url` is rebuilt from the pmid on load. */
const ARCH_KEEP = 60;                    // hard ceiling on rows, whatever they weigh
const ARCH_BUDGET = 3 * 1024 * 1024;     // bytes of archived bodies, of a ~5 MB quota
const ARCH_EXCERPT = 200;                // characters; a feed card shows about this much

const archKey = uid => 'arch:' + uid;
const issueKey = (uid, id) => 'issue:' + uid + ':' + id;
const archIndex = uid => lsGet(archKey(uid), []);
const pubmedUrl = pmid => 'https://pubmed.ncbi.nlm.nih.gov/' + pmid + '/';

function loadIssue(uid, id) {
  const arts = lsGet(issueKey(uid, id), null);
  if (arts) for (const a of arts) if (!a.url) a.url = pubmedUrl(a.pmid);
  return arts;
}

function slimArticle(a) {
  return {
    pmid: a.pmid, title: a.title, journal: a.journal, journalName: a.journalName,
    authors: (a.authors || []).slice(0, 3),
    score: a.score, claudeScore: a.claudeScore, blurb: a.blurb || '', tag: a.tag || '',
    // Only needed when there is no Claude blurb to show instead.
    excerpt: a.blurb ? '' : firstSentences(a.abstract || '', 2, ARCH_EXCERPT),
    // matched drives the term chips and the subtopic sections; a card shows five of them.
    why: { matched: (a.why?.matched || []).slice(0, 5) },
  };
}

function archiveRun(u, run) {
  if (!run || !(run.articles || []).length) return null;
  const id = String(run.generated || new Date().toISOString()).replace(/\D/g, '').slice(0, 14);
  const body = run.articles.map(slimArticle);
  const meta = {
    id, since: run.since, until: run.until, journals: run.journals, total: run.total,
    count: body.length, generated: run.generated || null, reranked: run.reranked || null,
    lead: (run.articles[0] || {}).title || '', bytes: JSON.stringify(body).length,
  };

  lsSet(issueKey(u.id, id), body);
  // lsSet swallows a quota failure, so confirm the body landed before indexing a row that
  // would otherwise open onto nothing.
  if (!lsGet(issueKey(u.id, id), null)) { toast('Not enough room to archive that issue.'); return null; }

  const prev = archIndex(u.id);
  const all = [meta, ...prev.filter(m => m.id !== id)].slice(0, ARCH_KEEP);
  /* Retention is a byte budget, not only a row count. Issues vary four-fold — the first is a
     month, the rest a week — so "keep the last 60" promises a capacity that may not exist:
     60 real weeks came to 4.8 MB of a 5 MB quota, which would have started failing profile
     saves. Keep the newest run of issues that fits and delete the bodies of the rest. */
  const idx = [];
  let used = 0;
  for (const m of all) {
    used += m.bytes || 0;
    if (used > ARCH_BUDGET && idx.length) break;
    idx.push(m);
  }
  const keep = new Set(idx.map(m => m.id));
  for (const old of prev) if (!keep.has(old.id)) lsDel(issueKey(u.id, old.id));
  lsSet(archKey(u.id), idx);
  return meta;
}

/* ------------------------------------------------------------------ scoring */

function tokenize(text) {
  const out = [];
  for (const raw of text.toLowerCase().replace(/[^a-z0-9-]+/g, ' ').split(/\s+/)) {
    const w = raw.replace(/^-+|-+$/g, '');
    if (w.length < 3 || STOP.has(w) || /^\d+$/.test(w)) continue;
    out.push(w);
  }
  return out;
}

function termsOf(text) {
  const t = tokenize(text);
  const out = t.slice();
  for (let i = 0; i + 1 < t.length; i++) out.push(t[i] + ' ' + t[i + 1]);
  return out;
}

/* DATA never changes for the life of the page, so build this once. subtopicOf() calls it
   per article and the feed calls subtopicOf() several times per article — rebuilding a
   255-entry Map a few hundred times a render was pure waste. */
let _subIdx = null;
const subtopicIndex = () => _subIdx || (_subIdx = (() => {
  const m = new Map();
  for (const s of DATA.taxonomy.specialties) for (const st of s.subtopics) m.set(s.id + ':' + st.id, [s, st]);
  return m;
})());

/* Interest tiers, replacing the old most-interesting-first ordering of USER.subtopics.
   A total order was the wrong instrument for twenty-odd items: moving one from #18 to #2
   was sixteen clicks of ▲, so nobody would ever maintain it — and because the ramp was
   index-based, adding a single subtopic silently reweighted every other one. Three buckets
   are one click each, order within a bucket carries no meaning, and what a subtopic is
   worth no longer depends on how many others happen to sit beside it.

   Core does two things: a heavier weight here, and a guaranteed slot in the issue over in
   topPicks(). The second is the one that matters — a weight can tilt a close call but it
   cannot stop a big-literature topic from taking the whole page.

   A term shared by several subtopics keeps the best (highest) weight of them. */
const TIERS = [
  ['core',       'Core',       1.60, 'Most of what I want to read'],
  ['interested', 'Interested', 1.00, 'Happy to see these'],
  ['occasional', 'Occasional', 0.55, 'Only when it is good'],
];
const TIER_W = Object.fromEntries(TIERS.map(([k, , w]) => [k, w]));
const DEFAULT_TIER = 'interested';

const tierOf = (u, key) => {
  const t = (u.tiers || {})[key];
  return TIER_W[t] === undefined ? DEFAULT_TIER : t;
};

function tierWeights(u) {
  const m = new Map();
  for (const k of u.subtopics) m.set(k, TIER_W[tierOf(u, k)]);
  return m;
}

/* The reader's subtopics grouped by tier, in tier order. Also the order the feed walks
   when deciding which interests get a guaranteed slot. */
const byTier = u => TIERS.map(([tier, label, w, blurb]) =>
  ({ tier, label, w, blurb, keys: u.subtopics.filter(k => tierOf(u, k) === tier) }));

// Tiers are keyed by subtopic, so dropping a specialty can strand entries behind.
function pruneTiers(u) {
  if (!u.tiers) return;
  const on = new Set(u.subtopics);
  for (const k of Object.keys(u.tiers)) if (!on.has(k)) delete u.tiers[k];
}

function userTerms(u) {
  const idx = subtopicIndex(), counts = new Map(), best = new Map();
  const rw = tierWeights(u);
  for (const key of u.subtopics) {
    const pair = idx.get(key);
    if (!pair) continue;
    const w = rw.get(key) ?? 1;
    for (const raw of pair[1].terms) {
      const t = raw.toLowerCase();
      counts.set(t, (counts.get(t) || 0) + 1);
      best.set(t, Math.max(best.get(t) || 0, w));
    }
  }
  const out = new Map();
  // topic score clamps at 1 downstream, so a >1 weight buys reach, not runaway scores.
  for (const [t, c] of counts) out.set(t, Math.min(1, 0.62 + 0.16 * (c - 1)) * (best.get(t) || 1));
  return out;
}

const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const hasPhrase = (hay, p) => new RegExp('(?<![a-z0-9])' + escRe(p) + '(?![a-z0-9])').test(hay);

function axisSignal(hay, ax) {
  let lo = 0, hi = 0;
  for (const s of ax.low_signals) if (hay.includes(s)) lo++;
  for (const s of ax.high_signals) if (hay.includes(s)) hi++;
  return lo + hi === 0 ? 0 : (hi - lo) / (lo + hi);
}

/* Absent evidence is not negative evidence — and the original formula scored it as such.
   `learned` is 0 for every article a reader sees before they have rated anything: not
   because the model dislikes those articles, but because it has nothing to say about them.
   Leaving that 0.16 in the divisor makes the top of the scale unreachable. Measured over a
   real 165-article week for a brand-new reader, the best paper in the issue scored 72 and
   nothing above 72 could exist — which reads as "it didn't find me anything good" when in
   fact it had found exactly what was asked for.

   So a channel only takes up its share of the scale once it has something to say. The
   divisor is the best score actually attainable given the channels this reader has, which
   is what "predicted interest, 0-100" claims to mean. Within one issue it is a constant,
   so the ordering is untouched: this changes what the number says, not who wins.

   The axis channel is not treated this way. Its 0 means "no signal fired in this article",
   which is genuinely neutral rather than absent — an article that pushes on no axis should
   not outscore one that pushes the reader's way. Only the reader having no axis
   preferences at all makes the channel dead, and that is what scoreScale() tests. */
const W_TOPIC = 0.52, W_JOURNAL = 0.14, W_AXIS_UP = 0.18, W_AXIS_DN = 0.10, W_LEARNED = 0.16;

/* The learned channel eases in rather than switching on, and the same fraction governs both
   its contribution and its share of the divisor. Switching it on at the first rating deflated
   every score in the next issue by about a sixth overnight — the reader rates one paper and
   is told the whole week got worse. Easing spreads that over the first dozen ratings, which
   is also the honest shape: one thumb is not the same evidence as thirty.
   Mirrors AXIS_LEARN_K, which does the same thing for the axes. */
const LEARN_LIVE_K = 12;   // ratings at which the learned channel carries half its weight

function scoreScale(u, priors) {
  const axis = Object.values(u.axisScores || {}).some(v => Math.abs(v) >= 0.05);
  const rated = Object.values(u.feedback || {}).filter(r => VERDICT_W[r.verdict]).length;
  const learned = Object.keys(u.weights || {}).length ? rated / (rated + LEARN_LIVE_K) : 0;
  // The best prior among journals *this* reader chose, so their ceiling is one they can hit.
  const jps = Object.values(priors || {});
  const maxJp = jps.length ? Math.max(...jps) : 0.9;
  return { axis, learned,
    max: W_TOPIC + W_JOURNAL * maxJp + (axis ? W_AXIS_UP : 0) + W_LEARNED * learned };
}

function scoreArticle(a, u, terms, priors, scale = scoreScale(u, priors)) {
  const text = [a.title, a.abstract, (a.keywords || []).join(' '), (a.mesh || []).join(' '),
    (a.pubtypes || []).join(' ')].join(' ');
  const hay = ' ' + text.toLowerCase().replace(/\s+/g, ' ') + ' ';

  const hits = [];
  for (const [t, w] of terms) if (hasPhrase(hay, t)) hits.push([t, w]);
  hits.sort((x, y) => y[1] - x[1]);
  /* Saturating rather than clamped. A hard min(1, sum/2.6) pinned every well-matched
     article to exactly 1.0, which threw away the ordering *within* the good ones — and
     made subtopic rank weights invisible, since they only shift a sum that was already
     over the cap. This curve approaches 1 without reaching it, so weights always tell. */
  const topic = hits.length
    ? 1 - Math.exp(-hits.slice(0, 8).reduce((s, h) => s + h[1], 0) / 1.8)
    : 0;

  let axTotal = 0, axN = 0;
  const axDetail = {};
  for (const ax of DATA.axes.axes) {
    const pref = u.axisScores[ax.id];
    if (pref === undefined) continue;
    const sig = axisSignal(hay, ax);
    if (sig === 0) continue;
    const c = pref * sig;
    axDetail[ax.id] = Math.round(c * 100) / 100;
    axTotal += c; axN++;
  }
  /* Confidence-weighted, not a mean. Averaging made one agreeing axis score exactly the same
     as five — 31% of a real week landed on exactly ±1 — so a paper in entirely the wrong
     style could ride into the top ten on a single accidental match, while a paper that
     agreed on four axes got no extra credit. tanh keeps the sign, rewards accumulating
     agreement, and still saturates rather than running away.

       1 axis agreeing → 0.46      3 → 0.90
       2 axes          → 0.76      5 → 0.99                                              */
  const axis = axN ? Math.tanh(axTotal / 2) : 0;

  const jp = priors[(a.journal || '').toLowerCase()] ?? 0.6;

  let learnedRaw = 0;
  const seen = new Set(termsOf(text));
  for (const t of seen) learnedRaw += u.weights[t] || 0;
  const learned = Math.tanh(learnedRaw / 4);

  let base = (W_TOPIC * topic + W_JOURNAL * jp
    + W_AXIS_UP * Math.max(0, axis) + W_AXIS_DN * Math.min(0, axis)
    + W_LEARNED * scale.learned * learned) / scale.max;

  const pt = (a.pubtypes || []).join(' ').toLowerCase();
  if (/editorial|comment|news/.test(pt)) base *= 0.55;
  if (/retracted|erratum/.test(pt)) base *= 0.15;
  if (!a.abstract) base *= 0.78;

  return {
    score: Math.round(Math.max(0, Math.min(1, base)) * 100),
    why: { topic: +topic.toFixed(3), axis: +axis.toFixed(3), journal: jp, learned: +learned.toFixed(3),
           matched: hits.slice(0, 8).map(h => h[0]), axisDetail: axDetail },
  };
}

function relearn(u) {
  const pos = new Map(), neg = new Map();
  let npos = 0, nneg = 0, n = 0;
  for (const r of Object.values(u.feedback)) {
    const w = VERDICT_W[r.verdict];
    if (!w) continue;
    n++;
    const ts = new Set(termsOf(r.text || r.title || ''));
    if (w > 0) { npos += w; for (const t of ts) pos.set(t, (pos.get(t) || 0) + w); }
    else { nneg += -w; for (const t of ts) neg.set(t, (neg.get(t) || 0) + -w); }
  }
  const weights = {};
  for (const t of new Set([...pos.keys(), ...neg.keys()])) {
    const p = pos.get(t) || 0, q = neg.get(t) || 0, mass = p + q;
    if (mass < 1.5 && n > 8) continue;
    let v = Math.log(((p + 0.5) / (npos + 1)) / ((q + 0.5) / (nneg + 1)));
    v *= mass / (mass + 3);
    if (Math.abs(v) > 0.05) weights[t] = +v.toFixed(4);
  }
  u.weights = weights;
  relearnAxes(u);
}

/* The this-or-that answers are a prior, not a verdict. They are collected once, in the
   first two minutes, when a reader is least calibrated about their own taste — so from
   then on every thumb is also evidence about where they sit on each axis.

   Ten axes is a far better-conditioned learning problem than thousands of term weights:
   each rating touches several axes at once, so the estimate firms up quickly. Learning
   eases in with the amount of evidence rather than replacing the stated answer outright,
   and axes the reader was never asked about start from neutral and are learned outright. */
const AXIS_LEARN_K = 10;   // ratings-with-signal at which learning carries ~half the weight

function relearnAxes(u) {
  const prior = u.axisPrior || {};
  const acc = {};
  for (const r of Object.values(u.feedback)) {
    const w = VERDICT_W[r.verdict];
    if (!w) continue;
    const hay = ' ' + (r.text || r.title || '').toLowerCase().replace(/\s+/g, ' ') + ' ';
    for (const ax of DATA.axes.axes) {
      const sig = axisSignal(hay, ax);
      if (!sig) continue;                       // silent on this axis: no evidence either way
      const a = acc[ax.id] || (acc[ax.id] = { num: 0, den: 0, m: 0 });
      a.num += w * sig;                         // liked + leans high → pull toward high
      a.den += Math.abs(w);
      a.m += 1;
    }
  }
  const out = {};
  for (const ax of DATA.axes.axes) {
    const p = prior[ax.id], a = acc[ax.id];
    if (!a || !a.den) { if (p !== undefined) out[ax.id] = p; continue; }
    const learned = Math.max(-1, Math.min(1, a.num / a.den));
    const alpha = a.m / (a.m + AXIS_LEARN_K);
    out[ax.id] = +((p === undefined ? 0 : p) * (1 - alpha) + learned * alpha).toFixed(3);
  }
  u.axisScores = out;
  u.axisEvidence = Object.fromEntries(Object.entries(acc).map(([k, v]) => [k, v.m]));
}

/* ------------------------------------------------- practice-changing & tiers */

const spanDays = run => {
  const d = s => new Date(String(s).replace(/\//g, '-'));
  return Math.max(1, (d(run.until) - d(run.since)) / 864e5);
};

/* What makes a paper change practice is its *design*, not its subject: a randomised phase-3
   trial that met a pre-specified endpoint, or a body that issues guidance saying so. This
   reads those markers off the record rather than guessing from the prose.

   Deliberately conservative — a label that fires on everything is worth nothing. Protocols,
   pilots and secondary analyses are excluded outright, however trial-like they read: a
   published protocol has, by definition, no result yet. */
const PC_DESIGN = /\brandomi[sz]ed\b|\brandomi[sz]ation\b|double-blind|placebo-controlled|phase 3|phase iii|non-?inferiority|superiority trial|intention[- ]to[- ]treat|pre-?specified primary|primary endpoint|primary outcome/i;
const PC_GUIDE = /clinical practice guideline|practice guideline|consensus statement|consensus recommendation|expert consensus|position statement|scientific statement|guideline update/i;
const PC_SCALE = /multicent(?:er|re)|multi-cent(?:er|re)|international trial|pivotal|event-driven|\b\d{3,5} (?:patients|participants|adults|children)\b/i;
const PC_RESULT = /significantly (?:reduced|improved|lower|higher|increased)|met (?:its|the) primary|superior to|noninferior|non-inferior|hazard ratio|absolute risk reduction|number needed to treat/i;
const PC_VETO = /study protocol|rationale and design|trial protocol|statistical analysis plan|pilot stud|feasibility stud|proof of concept|post hoc|secondary analysis|exploratory analysis|in mice|in vitro|animal model|case report|protocol for a/i;

const PT_TRIAL = /randomized controlled trial|clinical trial, phase (?:iii|iv)|controlled clinical trial|equivalence trial|pragmatic clinical trial/i;
const PT_GUIDE = /practice guideline|guideline|consensus development conference/i;
/* Must be the paper describing *itself*. A bare /randomi[sz]ed/ also matches "unlike
   randomised trials, …" in the background of an observational study, which is how a
   surveillance-colonoscopy cohort came back labelled a randomised trial. */
const PC_RANDOM = /randomly assigned|were randomi[sz]ed|we randomi[sz]ed|randomi[sz]ed to receive|randomi[sz]ed[, ]+(?:double-blind|controlled|open-label|placebo|clinical|phase)|(?:this|in the|of the) randomi[sz]ed|randomi[sz]ed \d+|assigned \(?1:1\)?|allocated to receive/i;

/* A paper that says a trial "is needed" is not a trial, and neither is a cohort study that
   compares itself to one. When the design is stated in the title, believe the title —
   unless PubMed has actually indexed it as a trial. */
const PC_OBSERVATIONAL = /\b(?:cohort study|retrospective (?:cohort|review|analysis|study)|observational study|registry (?:study|analysis)|cross-sectional|case-control|case series|database study|real-world (?:study|analysis|evidence))\b/i;

/* Correspondence *about* a trial is not the trial. These carry the trial's vocabulary —
   often its title verbatim — so they must be excluded on publication type, not on prose. */
const PT_VETO = /\b(?:letter|comment|editorial|published erratum|news|biography|retraction)\b/i;

function practiceChanging(a) {
  const text = [a.title, a.abstract].filter(Boolean).join(' ');
  if (!text || text.length < 120) return null;          // nothing to judge on
  const pts = (a.pubtypes || []).join(' ');
  if (PT_VETO.test(pts) || PC_VETO.test(text)) return null;
  if (/^(?:re|reply|response|comment on|letter)\b[:\s]/i.test(a.title || '')) return null;

  if (PT_GUIDE.test(pts) || PC_GUIDE.test(text)) return { level: 2, kind: 'guideline', label: 'Guideline' };

  /* Randomisation is the gate, not one signal among several. Without it, "primary outcome"
     and "hazard ratio" are just the vocabulary of any decent cohort study — which is how an
     observational muscle-loss paper and a liver-stiffness prognostic model both came back
     labelled practice-changing on the first pass. */
  const indexedTrial = PT_TRIAL.test(pts);
  if (!indexedTrial && PC_OBSERVATIONAL.test(a.title || '')) return null;
  const randomised = indexedTrial || PC_RANDOM.test(text)
    || (/placebo-controlled/i.test(text) && /double-blind/i.test(text));
  if (!randomised) return null;

  const pivotal = /phase 3|phase iii|pivotal|non-?inferiority|equivalence trial/i.test(text)
    || /clinical trial, phase (?:iii|iv)|equivalence trial/i.test(pts);
  const scale = PC_SCALE.test(text) || /multicenter study/i.test(pts);
  const result = PC_RESULT.test(text);

  if (pivotal && result) return { level: 2, kind: 'trial', label: 'Practice changing' };
  if (pivotal || (scale && result)) return { level: 2, kind: 'trial', label: 'Practice changing' };
  return { level: 1, kind: 'trial', label: 'Randomised trial' };
}

/* Journal standing is a curated call, not a computed one — citation counts are not in the
   PubMed record and impact factor is not ours to redistribute. Flagship means a general
   journal whose papers a clinician outside the field is still expected to know; leading
   means the reference journal within its specialty. Everything else carries no badge,
   which is the honest default rather than a slight. */
const FLAGSHIP = new Set(['N Engl J Med', 'Lancet', 'JAMA', 'BMJ', 'Nature', 'Science', 'Cell',
  'Nat Med', 'Ann Intern Med', 'Sci Transl Med', 'PLoS Med', 'Cochrane Database Syst Rev']);

function journalTier(abbrev) {
  if (!abbrev) return null;
  if (FLAGSHIP.has(abbrev)) return { cls: 'flagship', label: 'Flagship journal' };
  // Explicit list only. Deriving this from the volume-based `prior` badged a quarter of the
  // registry, which makes the badge mean nothing.
  const j = DATA.journals.journals[abbrev];
  if (j && j.tier === 'leading') return { cls: 'leading', label: 'Leading in its field' };
  return null;
}

function badges(a) {
  const out = [];
  const pc = practiceChanging(a);
  if (pc) out.push(`<span class="badge pc${pc.level === 2 ? ' hi' : ''}">${esc(pc.label)}</span>`);
  const t = journalTier(a.journal);
  if (t) out.push(`<span class="badge ${t.cls}">${esc(t.label)}</span>`);
  return out.length ? `<span class="badges">${out.join('')}</span>` : '';
}

/* ------------------------------------------------------------- does it work? */

/* Every rating already records `predicted` — the score the model gave that article at the
   moment it was rated. That is a held-out test set nobody was reading: the prediction was
   made before the verdict existed, so comparing them is honest.

   The headline number is the probability that a randomly chosen article you liked scored
   above a randomly chosen one you didn't (the rank statistic behind ROC AUC). It is used
   instead of a mean gap because it is unitless and immune to the score scale drifting. */
function calibration(u) {
  const rated = Object.values(u.feedback)
    .filter(r => typeof r.predicted === 'number' && VERDICT_W[r.verdict]);
  const pos = rated.filter(r => VERDICT_W[r.verdict] > 0).map(r => r.predicted);
  const neg = rated.filter(r => VERDICT_W[r.verdict] < 0).map(r => r.predicted);
  const out = { npos: pos.length, nneg: neg.length, ready: pos.length >= 3 && neg.length >= 3 };
  if (!out.ready) return out;
  let better = 0;
  for (const p of pos) for (const q of neg) better += p > q ? 1 : p === q ? 0.5 : 0;
  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  out.agree = better / (pos.length * neg.length);
  out.mpos = mean(pos); out.mneg = mean(neg);
  return out;
}

function calibrationPanel(u) {
  const c = calibration(u);
  if (!c.ready) {
    const need = [];
    if (c.npos < 3) need.push(`${3 - c.npos} more 👍`);
    if (c.nneg < 3) need.push(`${3 - c.nneg} more 👎`);
    return `<div class="note"><b>Not enough ratings to score itself yet.</b>
      It needs at least three of each to compare. ${need.length ? esc(need.join(' and ')) + ' to go.' : ''}
      <span class="hint">Rating a few you actively don't want matters as much as rating the good ones —
      without them there's nothing to separate.</span></div>`;
  }
  const pct = Math.round(c.agree * 100);
  const verdict =
    c.agree >= 0.75 ? ['good', 'It is ranking well. Your top of the list is genuinely your top.']
    : c.agree >= 0.62 ? ['ok', 'Better than chance, with room to improve. More ratings will sharpen it.']
    : c.agree >= 0.5 ? ['weak', 'Barely better than shuffling. Worth retaking the this-or-that, or checking your topic order.']
    : ['bad', 'Worse than chance — it is currently ranking your feed roughly upside down. Retake the this-or-that.'];
  return `<div class="calib ${verdict[0]}">
    <div class="cbig">${pct}<span>%</span></div>
    <div class="cbody"><b>agreement between its scores and your thumbs</b>
      <div class="hint">Chance is 50%. Measured on ${c.npos + c.nneg} rated articles, using the score
      each one had <i>before</i> you rated it.</div>
      <div class="cbars">
        <div><span class="cl">👍 you liked</span><i style="width:${Math.round(c.mpos)}%"></i><b>${Math.round(c.mpos)}</b></div>
        <div><span class="cl">👎 you didn't</span><i class="lo" style="width:${Math.round(c.mneg)}%"></i><b>${Math.round(c.mneg)}</b></div>
      </div>
      <div class="hint">${verdict[1]}</div></div></div>`;
}

/* ---------------------------------------------------------- journal picking */

function suggestJournals(u) {
  const idx = subtopicIndex(), score = new Map(), why = new Map();
  const depth = {};
  for (const k of u.subtopics) { const s = k.split(':')[0]; depth[s] = (depth[s] || 0) + 1; }

  const bump = (j, amt, label) => {
    score.set(j, (score.get(j) || 0) + amt);
    const list = why.get(j) || []; if (!list.includes(label)) list.push(label);
    why.set(j, list);
  };
  for (const sid of u.specialties) {
    const s = DATA.taxonomy.specialties.find(x => x.id === sid);
    if (!s) continue;
    const w = 1 + 0.35 * (depth[sid] || 0);
    for (const j of s.journals || []) bump(j, w, s.name);
  }
  for (const key of u.subtopics) {
    const pair = idx.get(key);
    if (!pair) continue;
    for (const j of pair[1].journals || []) bump(j, 1.6, pair[1].name);
  }
  if (!score.size) return [];
  const cutoff = Math.max(...score.values()) * 0.55;
  const out = [];
  for (const [abbrev, sc] of score) {
    const meta = DATA.journals.journals[abbrev];
    if (!meta) continue;
    out.push({ abbrev, name: meta.name, score: sc, volume: meta.count,
               why: (why.get(abbrev) || []).join(', ').slice(0, 120), core: sc >= cutoff });
  }
  out.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  return out.slice(0, 48);
}

/* ------------------------------------------------------------------- pubmed */

async function eutils(path, params) {
  const url = EUTILS + path + '?' + new URLSearchParams(params);
  const r = await fetch(url);
  if (!r.ok) throw new Error(`PubMed ${r.status}`);
  return r;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function parseArticles(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const out = [];
  for (const pa of doc.querySelectorAll('PubmedArticle')) {
    const txt = sel => { const n = pa.querySelector(sel); return n ? n.textContent.trim() : ''; };
    const parts = [];
    for (const ab of pa.querySelectorAll('Abstract > AbstractText')) {
      const label = ab.getAttribute('Label');
      parts.push(label ? `${label}: ${ab.textContent.trim()}` : ab.textContent.trim());
    }
    const authors = [];
    for (const a of pa.querySelectorAll('AuthorList > Author')) {
      const ln = a.querySelector('LastName'), ini = a.querySelector('Initials');
      if (ln) authors.push((ln.textContent + ' ' + (ini ? ini.textContent : '')).trim());
    }
    let doi = '';
    for (const id of pa.querySelectorAll('ArticleIdList > ArticleId')) {
      if (id.getAttribute('IdType') === 'doi') doi = id.textContent.trim();
    }
    const pmid = txt('MedlineCitation > PMID');
    out.push({
      pmid, doi,
      title: txt('Article > ArticleTitle').replace(/\s+/g, ' ').replace(/^\[|\]\.?$/g, ''),
      abstract: parts.join(' '),
      journal: txt('Journal > ISOAbbreviation') || txt('Journal > Title'),
      year: txt('Journal PubDate > Year'),
      authors,
      keywords: [...pa.querySelectorAll('KeywordList > Keyword')].map(k => k.textContent.trim()),
      mesh: [...pa.querySelectorAll('MeshHeading > DescriptorName')].map(m => m.textContent.trim()),
      pubtypes: [...pa.querySelectorAll('PublicationTypeList > PublicationType')].map(p => p.textContent.trim()),
      url: `https://pubmed.ncbi.nlm.nih.gov/${pmid}/`,
    });
  }
  return out;
}

async function runScan(u, days, onProgress) {
  const until = new Date();
  const since = new Date(until.getTime() - days * 864e5);
  const fmt = d => `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  const clause = u.journals.map(a => `"${a}"[ta]`).join(' OR ');
  const term = `(${clause}) AND ("${fmt(since)}"[EDAT] : "${fmt(until)}"[EDAT])`;

  onProgress('searching PubMed…', 0, 0);
  const sr = await (await eutils('esearch.fcgi', { db: 'pubmed', term, retmax: 2000, retmode: 'json', sort: 'date' })).json();
  const ids = sr.esearchresult.idlist || [];
  const seen = new Set(u.seen);
  const fresh = ids.filter(i => !seen.has(i));
  if (!fresh.length) return { articles: [], since: fmt(since), until: fmt(until), total: ids.length };

  const arts = [];
  const CHUNK = 100;
  for (let i = 0; i < fresh.length; i += CHUNK) {
    const batch = fresh.slice(i, i + CHUNK);
    onProgress('fetching records', Math.min(i + CHUNK, fresh.length), fresh.length);
    try {
      const r = await eutils('efetch.fcgi', { db: 'pubmed', id: batch.join(','), retmode: 'xml' });
      arts.push(...parseArticles(await r.text()));
    } catch (e) { console.warn('batch failed, skipping', e); }
    await sleep(400);
  }

  onProgress('scoring…', fresh.length, fresh.length);
  const terms = userTerms(u);
  const priors = {};
  for (const a of u.journals) priors[a.toLowerCase()] = (DATA.journals.journals[a] || {}).prior ?? 0.7;
  const names = {};
  for (const a of u.journals) names[a.toLowerCase()] = (DATA.journals.journals[a] || {}).name || a;

  // One scale for the whole issue, so every article in it is scored on the same ruler.
  const scale = scoreScale(u, priors);
  for (const a of arts) {
    a.journalName = names[(a.journal || '').toLowerCase()] || a.journal;
    const { score, why } = scoreArticle(a, u, terms, priors, scale);
    a.score = score; a.why = why;
  }
  arts.sort((x, y) => y.score - x.score);

  u.seen = [...new Set([...u.seen, ...arts.map(a => a.pmid)])].slice(-6000);
  return { articles: arts, since: fmt(since), until: fmt(until), total: ids.length,
           generated: new Date().toISOString(), journals: u.journals.length,
           scaleMax: scale.max };
}

/* ---------------------------------------------------- optional Claude rerank */

async function claudeRerank(run, u, onProgress) {
  const key = lsGet('anthropicKey', '');
  if (!key) throw new Error('No API key set. Add one in Settings.');
  const top = run.articles.slice(0, 30);
  const payload = top.map((a, i) => ({
    rank: i + 1, pmid: a.pmid, prior: a.score, title: a.title,
    journal: a.journalName, abstract: (a.abstract || '').slice(0, 2200),
    matched: a.why.matched,
  }));
  const idx = subtopicIndex();
  const interests = u.subtopics.map(k => (idx.get(k) || [null, {}])[1].name).filter(Boolean);
  const axisSummary = Object.entries(u.axisScores).map(([id, v]) => {
    const ax = DATA.axes.axes.find(a => a.id === id);
    if (!ax || Math.abs(v) < 0.05) return null;
    return `${ax.name}: leans ${v > 0 ? ax.high_label : ax.low_label}`;
  }).filter(Boolean);

  const prompt =
`You are ranking this week's new medical literature for one reader.

READER PROFILE
Topics of interest: ${interests.join(', ')}
Reading style: ${axisSummary.join('; ') || 'no strong preferences recorded'}

The "prior" score on each article is a keyword heuristic. It is reliably wrong in
both directions: it over-rewards an article that merely repeats a matched phrase,
and under-rewards an on-topic article that happens not to use the configured
vocabulary. Correct it by reading the abstracts.

Return ONLY a JSON array, one object per article, no prose:
[{"pmid":"...","score":0-100,"blurb":"...","tag":"..."}]

score: predicted interest for THIS reader. 85-100 = will almost certainly read it.
70-84 = strong. 50-69 = runner-up. 25-49 = probably skip. 0-24 = off-target.
blurb: 1-2 concrete sentences. Lead with what was actually done and the number that
matters (n, effect, method). Not "this study investigates". Say why this reader
would care. If you moved something far from its prior, say so.
tag: 1-3 lowercase words.

ARTICLES
${JSON.stringify(payload)}`;

  onProgress('Claude is reading ' + top.length + ' abstracts…');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 16000,
      thinking: { type: 'adaptive' },
      output_config: { effort: 'high' },
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  if (!r.ok) {
    const body = await r.text();
    throw new Error(`Anthropic API ${r.status}: ${body.slice(0, 300)}`);
  }
  const data = await r.json();
  if (data.stop_reason === 'refusal') throw new Error('Request was declined by safety classifiers.');
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if (!textBlock) throw new Error('No text in response.');
  const m = textBlock.text.match(/\[[\s\S]*\]/);
  if (!m) throw new Error('Could not parse a JSON array from the response.');
  const scored = JSON.parse(m[0]);
  const byPmid = new Map(scored.map(s => [String(s.pmid), s]));
  for (const a of run.articles) {
    const s = byPmid.get(a.pmid);
    if (s) { a.claudeScore = Math.round(s.score); a.blurb = s.blurb || ''; a.tag = s.tag || ''; }
  }
  run.articles.sort((a, b) =>
    (b.claudeScore ?? b.score * 0.95) - (a.claudeScore ?? a.score * 0.95));
  run.reranked = new Date().toISOString();
  return scored.length;
}

const finalScore = a => (a.claudeScore ?? a.score);
