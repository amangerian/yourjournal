<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Journal</title>
<meta name="description" content="A weekly feed of new medical research, ranked for your interests. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
<style>
:root{--bg:#faf9f6;--fg:#1b1a18;--mut:#6f6a63;--card:#fff;--line:#e3ded5;--acc:#7a4b2a;
--hi:#f2ede4;--up:#2f6b45;--upbg:#e4f0e8;--dn:#8a3b32;--dnbg:#f7e7e4;--star:#a8801c;--starbg:#f8f0d9;
--rule:#cfc7ba}
@media(prefers-color-scheme:dark){:root{--bg:#14140f;--fg:#eae5db;--mut:#9d968b;--card:#1e1d18;
--line:#33302a;--acc:#d9a273;--hi:#25231d;--up:#7fc39a;--upbg:#1d2f24;--dn:#e0897c;--dnbg:#2f1f1c;
--star:#e0b95c;--starbg:#2b2416;--rule:#403c34}}
:root[data-theme=dark]{--bg:#14140f;--fg:#eae5db;--mut:#9d968b;--card:#1e1d18;--line:#33302a;
--acc:#d9a273;--hi:#25231d;--up:#7fc39a;--upbg:#1d2f24;--dn:#e0897c;--dnbg:#2f1f1c;
--star:#e0b95c;--starbg:#2b2416;--rule:#403c34}
:root[data-theme=light]{--bg:#faf9f6;--fg:#1b1a18;--mut:#6f6a63;--card:#fff;--line:#e3ded5;
--acc:#7a4b2a;--hi:#f2ede4;--up:#2f6b45;--upbg:#e4f0e8;--dn:#8a3b32;--dnbg:#f7e7e4;
--star:#a8801c;--starbg:#f8f0d9;--rule:#cfc7ba}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 ui-serif,Georgia,"Times New Roman",serif;
margin:0;padding:0 1.25rem 6rem}
.wrap{max-width:54rem;margin:0 auto}
.wide{max-width:66rem}
a{color:var(--acc)}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
padding:.85rem 0 .75rem;margin-bottom:1.8rem;z-index:9}
nav .in{max-width:66rem;margin:0 auto;display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
nav .brand{font:700 15px ui-serif,Georgia,serif;letter-spacing:-.01em;margin-right:.9rem;
color:var(--fg);text-decoration:none}
nav a.tab{font:600 11px ui-sans-serif,system-ui;letter-spacing:.07em;text-transform:uppercase;
color:var(--mut);text-decoration:none;padding:.38rem .65rem;border-radius:6px;
border:1px solid transparent}
nav a.tab:hover{background:var(--hi);color:var(--fg)}
nav a.tab.on{background:var(--hi);color:var(--fg);border-color:var(--line)}
nav .sp{flex:1}
nav .who{font:12px ui-sans-serif,system-ui;color:var(--mut)}
h1{font-size:1.7rem;margin:0 0 .25rem;letter-spacing:-.015em}
h2{font:600 11px/1 ui-sans-serif,system-ui;letter-spacing:.1em;text-transform:uppercase;
color:var(--mut);margin:2.5rem 0 1rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
.sub{color:var(--mut);font:13px/1.55 ui-sans-serif,system-ui;margin-bottom:1.8rem}
.sub b{color:var(--fg)} .sub a{color:var(--acc)}
.btn{font:13px ui-sans-serif,system-ui;background:var(--acc);color:var(--bg);border:0;
border-radius:7px;padding:.62rem 1.15rem;cursor:pointer;font-weight:600;text-decoration:none;
display:inline-block}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--fg);border-color:var(--acc)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:1.6rem}
input[type=text]{font:14px ui-sans-serif,system-ui;background:var(--card);color:var(--fg);
border:1px solid var(--line);border-radius:7px;padding:.6rem .75rem;min-width:16rem}
input[type=text]:focus{outline:0;border-color:var(--acc)}

/* onboarding */
.steps{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.6rem;font:11px ui-sans-serif,system-ui;
letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.steps span{padding:.3rem .6rem;border-radius:99px;border:1px solid var(--line)}
.steps span.on{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
.steps span.done{color:var(--up);border-color:var(--up)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.65rem}
.pick{display:flex;gap:.6rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);
border-radius:10px;padding:.85rem .95rem;cursor:pointer;transition:all .12s;text-align:left;
font:inherit;color:inherit;width:100%}
.pick:hover{border-color:var(--acc)}
.pick.on{border-color:var(--up);background:var(--upbg)}
.pick .ic{font-size:1.15rem;line-height:1.2}
.pick .nm{display:block;font-weight:600;font-size:.97rem}
.pick .ct{display:block;font:12px ui-sans-serif,system-ui;color:var(--mut);margin-top:.15rem}
.pick.on .ct{color:var(--up)}
.grp{margin-bottom:1.8rem}
.grp h3{font:600 13px ui-sans-serif,system-ui;margin:0 0 .6rem;color:var(--fg)}
.pair{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.2rem;
margin-bottom:1rem}
.pair .ax{font:10px ui-sans-serif,system-ui;letter-spacing:.09em;text-transform:uppercase;
color:var(--mut);margin-bottom:.7rem}
.pair .opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.pair button{font:inherit;font-size:.95rem;line-height:1.45;background:var(--bg);color:var(--fg);
border:1px solid var(--line);border-radius:9px;padding:.9rem 1rem;cursor:pointer;text-align:left;
transition:all .12s}
.pair button:hover{border-color:var(--acc)}
.pair button.on{border-color:var(--up);background:var(--upbg)}
.pair .skip{display:flex;gap:.5rem;margin-top:.6rem}
.pair .skip button{flex:1;text-align:center;font:12px ui-sans-serif,system-ui;padding:.45rem;
color:var(--mut)}
@media(max-width:620px){.pair .opts{grid-template-columns:1fr}}

/* article cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.05rem 1.2rem;
margin-bottom:.85rem;transition:opacity .18s}
.card.dis{opacity:.45}
.card.sav{border-color:var(--star)}
.top{display:flex;gap:.8rem;align-items:baseline}
.rk{font:600 13px ui-sans-serif,system-ui;color:var(--mut);min-width:1.5rem}
.sc{font:700 15px ui-sans-serif,system-ui;color:var(--acc);min-width:2.3rem;text-align:right}
.ti{font-size:1.02rem;font-weight:600;line-height:1.4;flex:1}
.ti a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.ti a:hover{border-color:var(--acc)}
.ind{margin-left:4.7rem}
.meta{font:12px ui-sans-serif,system-ui;color:var(--mut);margin-top:.45rem}
.meter{height:3px;background:var(--line);border-radius:2px;margin-top:.7rem;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.tag{display:inline-block;font:11px ui-sans-serif,system-ui;background:var(--hi);color:var(--mut);
border:1px solid var(--line);border-radius:99px;padding:.14rem .55rem;margin:.28rem .3rem 0 0}
.acts{display:flex;gap:.35rem;margin-top:.7rem;align-items:center;flex-wrap:wrap}
.acts button{font:15px/1 ui-sans-serif,system-ui;background:transparent;color:var(--mut);
border:1px solid var(--line);border-radius:7px;padding:.34rem .6rem;cursor:pointer;
transition:all .13s;opacity:.55}
.acts button:hover{opacity:1;border-color:var(--acc)}
.acts button.on{opacity:1}
.acts button.on[data-v=love],.acts button.on[data-v=like]{background:var(--upbg);border-color:var(--up)}
.acts button.on[data-v=dislike]{background:var(--dnbg);border-color:var(--dn)}
.acts button.sv.on{background:var(--starbg);border-color:var(--star);color:var(--star)}
.acts .st{font:11px ui-sans-serif,system-ui;color:var(--mut);margin-left:.3rem;opacity:0;
transition:opacity .2s}
.acts .st.show{opacity:1}
.empty{color:var(--mut);font:14px ui-sans-serif,system-ui;padding:3.5rem 0;text-align:center}
.note{background:var(--hi);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;
font:13px/1.6 ui-sans-serif,system-ui;color:var(--mut);margin-top:2.2rem}
.note b{color:var(--fg)}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:.9rem;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}

/* newspaper */
.paper{max-width:64rem;margin:0 auto}
.masthead{text-align:center;border-bottom:3px double var(--rule);padding:1.4rem 0 .9rem;
margin-bottom:.5rem}
.masthead h1{font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:-.02em;margin:0;font-weight:700}
.masthead .dek{font:11px ui-sans-serif,system-ui;letter-spacing:.28em;text-transform:uppercase;
color:var(--mut);margin-top:.5rem}
.rule{border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;
font:11px ui-sans-serif,system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
padding:.5rem 0;margin-bottom:1.6rem}
.lead{border-bottom:1px solid var(--rule);padding-bottom:1.5rem;margin-bottom:1.5rem}
.lead .kick{font:11px ui-sans-serif,system-ui;letter-spacing:.16em;text-transform:uppercase;
color:var(--acc);font-weight:700;margin-bottom:.5rem}
.lead h3{font-size:clamp(1.5rem,3.4vw,2.15rem);line-height:1.16;margin:0 0 .6rem;
letter-spacing:-.015em;font-weight:700}
.lead h3 a{color:inherit;text-decoration:none}
.lead h3 a:hover{color:var(--acc)}
.lead .byline{font:12px ui-sans-serif,system-ui;color:var(--mut);margin-bottom:.8rem;
text-transform:uppercase;letter-spacing:.06em}
.lead .body{columns:2;column-gap:2.2rem;font-size:1rem;line-height:1.6;text-align:justify;
hyphens:auto}
.lead .body p{margin:0}
.lead .body::first-letter{float:left;font-size:3.1rem;line-height:.82;padding:.1rem .5rem .1rem 0;
font-weight:700;color:var(--acc)}
.cols{columns:3;column-gap:2rem}
.cols.two{columns:2;column-gap:2.4rem}
.story{break-inside:avoid;padding-bottom:1.1rem;margin-bottom:1.1rem;
border-bottom:1px solid var(--line)}
.story h4{font-size:1.05rem;line-height:1.3;margin:0 0 .35rem;font-weight:700;letter-spacing:-.005em}
.story h4 a{color:inherit;text-decoration:none}
.story h4 a:hover{color:var(--acc)}
.story .src{font:10px ui-sans-serif,system-ui;letter-spacing:.09em;text-transform:uppercase;
color:var(--mut);margin-bottom:.4rem}
.story .dek{font-size:.9rem;line-height:1.5;color:var(--fg);text-align:justify;hyphens:auto}
.story .scr{float:right;font:700 11px ui-sans-serif,system-ui;color:var(--acc);
border:1px solid var(--line);border-radius:99px;padding:.05rem .4rem;margin-left:.4rem}
.secthead{font:700 11px ui-sans-serif,system-ui;letter-spacing:.16em;text-transform:uppercase;
color:var(--fg);border-top:2px solid var(--rule);border-bottom:1px solid var(--line);
padding:.4rem 0;margin:0 0 1rem}
.papernote{border-top:3px double var(--rule);margin-top:2rem;padding-top:1rem;
font:12px/1.6 ui-sans-serif,system-ui;color:var(--mut);text-align:center}
@media(max-width:900px){.cols{columns:2}}
@media(max-width:620px){.cols{columns:1}.lead .body{columns:1}}
@media(max-width:600px){.ind{margin-left:0}}

/* --- web-app additions --- */
.pick.multi{cursor:pointer}
.hint{font:12px ui-sans-serif,system-ui;color:var(--mut)}
.cols.two{columns:2}
input[type=password]{font:14px ui-monospace,Menlo,monospace;background:var(--card);color:var(--fg);
border:1px solid var(--line);border-radius:7px;padding:.6rem .75rem;min-width:20rem}
input[type=password]:focus{outline:0;border-color:var(--acc)}
input[type=file]{font:13px ui-sans-serif,system-ui;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%);background:var(--fg);
color:var(--bg);font:13px ui-sans-serif,system-ui;padding:.6rem 1.1rem;border-radius:8px;
opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:.95}
nav .brand{cursor:pointer}
nav a.tab,nav .who a{cursor:pointer}
.note a,.sub a,.empty a{cursor:pointer}
code{font:12px ui-monospace,Menlo,monospace;background:var(--hi);border:1px solid var(--line);
border-radius:4px;padding:.1rem .35rem}
@media(max-width:620px){.cols.two{columns:1}input[type=password]{min-width:100%}}

/* export reminder */
.banner{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;justify-content:space-between;
background:var(--starbg);border:1px solid var(--star);border-radius:10px;
padding:.9rem 1.1rem;margin:0 0 1.8rem;font:13px/1.55 ui-sans-serif,system-ui;color:var(--fg)}
.banner b{color:var(--fg)}
.banner .acts-row{display:flex;gap:.5rem;flex-shrink:0}
.banner .btn{padding:.45rem .85rem;font-size:12px}
@media(max-width:600px){.banner{flex-direction:column;align-items:flex-start}}

/* ============ v2: tutorial, To Read Later, journal browser, paper sections ============ */

/* multi-select affordance — a real checkbox so "select many" is obvious */
.pick{position:relative}
.pick .box{flex:0 0 auto;width:15px;height:15px;margin-top:.18rem;border:1.5px solid var(--line);
border-radius:4px;background:var(--bg);transition:all .12s;position:relative}
.pick.on .box{background:var(--up);border-color:var(--up)}
.pick.on .box::after{content:"✓";position:absolute;inset:0;color:var(--bg);font:700 11px/15px
ui-sans-serif,system-ui;text-align:center}
.linkbtn{background:none;border:0;color:var(--acc);font:12px ui-sans-serif,system-ui;cursor:pointer;
padding:0 .35rem;text-decoration:underline;font-weight:500}
.grp h3{display:flex;align-items:baseline;gap:.2rem;flex-wrap:wrap}
.sticky-row{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 62%,transparent);
padding:1rem 0 1.1rem;margin-top:1.2rem;z-index:6}

/* journal browser */
#jsearch{font:14px ui-sans-serif,system-ui;background:var(--card);color:var(--fg);
border:1px solid var(--line);border-radius:7px;padding:.6rem .8rem;width:100%;max-width:26rem;
margin-bottom:.9rem}
#jsearch:focus{outline:0;border-color:var(--acc)}
.jbrowse{max-height:30rem;overflow-y:auto;padding:.3rem;border:1px solid var(--line);
border-radius:10px;background:var(--bg)}

/* To Read Later strip */
.trl{background:var(--starbg);border:1px solid var(--star);border-radius:10px;
padding:.7rem 1rem;margin-bottom:1.6rem;font:13px ui-sans-serif,system-ui}
.trl summary{cursor:pointer;font-weight:700;color:var(--fg);list-style:none;display:flex;
align-items:baseline;gap:.6rem}
.trl summary::-webkit-details-marker{display:none}
.trl summary::before{content:"▸";color:var(--star);transition:transform .15s;display:inline-block}
.trl[open] summary::before{transform:rotate(90deg)}
.trl ul{list-style:none;margin:.7rem 0 .1rem;padding:0}
.trl li{display:flex;gap:.6rem;align-items:baseline;padding:.35rem 0;border-top:1px solid var(--line)}
.trl li a{color:var(--fg);text-decoration:none;flex:1;font-size:13px;line-height:1.45}
.trl li a:hover{color:var(--acc)}
.trl li .src{font:11px ui-sans-serif,system-ui;color:var(--mut);white-space:nowrap}
.unsave{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;padding:0 .2rem}
.unsave:hover{color:var(--dn)}

/* tutorial */
.how-step{display:flex;gap:1.1rem;align-items:flex-start;margin-bottom:2.2rem}
.how-n{flex:0 0 auto;width:2rem;height:2rem;border-radius:50%;background:var(--acc);color:var(--bg);
font:700 14px/2rem ui-sans-serif,system-ui;text-align:center}
.how-step h3{font:600 1.05rem ui-serif,Georgia,serif;margin:.15rem 0 .5rem;color:var(--fg)}
.how-step p{font:14px/1.62 ui-sans-serif,system-ui;color:var(--mut);margin:0 0 .7rem}
.how-step b{color:var(--fg)}
.how-table{border-collapse:collapse;margin:.4rem 0 .9rem;font:13px/1.5 ui-sans-serif,system-ui}
.how-table td{padding:.4rem .8rem .4rem 0;vertical-align:top;color:var(--mut);
border-bottom:1px solid var(--line)}
.how-table td:first-child{font-size:1rem;white-space:nowrap}
.how-table b{color:var(--fg)}

/* API-key instructions */
.keyhelp{background:var(--hi);border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem;
margin:.4rem 0 1rem;font:13px/1.6 ui-sans-serif,system-ui;color:var(--mut)}
.keyhelp summary{cursor:pointer;font-weight:600;color:var(--fg)}
.keyhelp ol{margin:.8rem 0 .6rem;padding-left:1.2rem}
.keyhelp li{margin-bottom:.5rem}
.keyhelp b{color:var(--fg)}
.keyhelp p{margin:.7rem 0 0}

/* The Paper — section landmarks and varied story sizes */
.psec{margin-bottom:2.4rem}
.secthead{display:flex;justify-content:space-between;align-items:baseline;
font:700 11px ui-sans-serif,system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--fg);
border-top:3px double var(--rule);border-bottom:1px solid var(--line);padding:.5rem 0;margin:0 0 1.1rem}
.secthead .secn{font-weight:400;color:var(--mut);letter-spacing:.04em}
.seconds{display:grid;grid-template-columns:1fr 1fr;gap:2.2rem;padding-bottom:1.6rem;
margin-bottom:1.8rem;border-bottom:1px solid var(--rule)}
.story.big h4{font-size:1.28rem;line-height:1.22}
.story.big .dek{font-size:.97rem}
.story.small h4{font-size:1.02rem}
.storyfoot{display:flex;align-items:center;gap:.6rem;margin-top:.55rem;flex-wrap:wrap}
.storyfoot .scr{float:none;margin:0}
.paper-sv{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--mut);
font:11px ui-sans-serif,system-ui;padding:.2rem .5rem;cursor:pointer;transition:all .12s}
.paper-sv:hover{border-color:var(--star);color:var(--star)}
.paper-sv.on{background:var(--starbg);border-color:var(--star);color:var(--star);font-weight:600}
.lead .storyfoot{margin-top:1rem}
.blurb.dim{color:var(--mut)}
@media(max-width:760px){.seconds{grid-template-columns:1fr;gap:1.4rem}}

/* profile chooser */
.pickgrid .pick{flex-direction:column;gap:.15rem;text-align:left}
.newrow{display:flex;gap:.5rem;align-items:center;margin:.5rem 0 1rem;flex-wrap:wrap}
.newrow input{flex:1 1 14rem;min-width:0;background:var(--card);border:1px solid var(--line);
  color:var(--fg);border-radius:7px;padding:.55rem .7rem;font:inherit;font-size:.95rem}
.newrow input:focus{outline:none;border-color:var(--acc)}

</style>
</head>
<body>
<div id="app"><div class="wrap"><h1>Your Journal</h1><div class="sub">Loading…</div></div></div>

<script>
/* Your Journal — static web app.
 *
 * Runs entirely in the browser. PubMed E-utilities is called directly (NCBI sends
 * Access-Control-Allow-Origin: *), so there is no backend and no shared rate-limit
 * pool — each reader spends their own 3 req/s against their own IP.
 *
 * Storage is localStorage, namespaced per profile. Optional: a reader can paste
 * their own Anthropic API key to enable the semantic re-rank pass; the key is kept
 * in their browser and sent only to api.anthropic.com.
 */
'use strict';

const EUTILS = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
const STORE = 'yj:';
const MODEL = 'claude-opus-5';

const VERDICT_W = { love: 2, like: 1, dislike: -1 };
const STOP = new Set(('a an the and or but if of in on at to for with without from by as is are was were be been being ' +
  'this that these those it its their there here we our you your they them he she his her not no than then so such can ' +
  'could may might will would shall should do does did done have has had using use used study studies research results ' +
  'result methods method conclusion conclusions background objective objectives purpose aim aims findings show shows ' +
  'shown showed suggest suggests associated association between among within across during after before significant ' +
  'significantly higher lower increase increased decrease decreased effect effects however also more most less least ' +
  'both each other others all any some new novel first second via versus vs based upon into over under about which who ' +
  'whom whose what when where why how one two three four five patients patient group groups subjects participants data ' +
  'analysis analyses evidence review overview report reports case cases').split(' '));

let DATA = { taxonomy: null, axes: null, journals: null };
let USER = null;

/* ------------------------------------------------------------------ storage */

const lsGet = (k, d) => { try { const v = localStorage.getItem(STORE + k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(STORE + k, JSON.stringify(v)); } catch (e) { toast('Storage full — export your profile.'); } };

function listProfiles() { return lsGet('profiles', []); }

function newProfile(name) {
  const id = (name || 'reader').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'reader';
  const profiles = listProfiles();
  const uid = profiles.some(p => p.id === id) ? id + '-' + Math.random().toString(36).slice(2, 6) : id;
  const u = {
    id: uid, name: name || 'Reader', created: new Date().toISOString(),
    step: 'specialties', specialties: [], subtopics: [], axisScores: {},
    journals: [], feedback: {}, library: {}, weights: {}, seen: [], run: null,
  };
  profiles.push({ id: uid, name: u.name });
  lsSet('profiles', profiles);
  lsSet('u:' + uid, u);
  lsSet('active', uid);
  return u;
}

function loadProfile(id) { return lsGet('u:' + id, null); }
function saveUser() { lsSet('u:' + USER.id, USER); }

const DAY = 864e5;
const EXPORT_EVERY = 7 * DAY;   // remind once a week
const SNOOZE_FOR = 3 * DAY;     // "not now" buys three days, not silence

function exportProfile() {
  USER.lastExport = new Date().toISOString();
  delete USER.exportSnooze;
  const blob = new Blob([JSON.stringify(USER, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `yourjournal-${USER.id}-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  saveUser();
}

/* Nag to export, but only when there is something to lose and only once a week.
   A reader who has rated nothing has no state worth backing up, so stay quiet. */
function exportBannerHTML() {
  if (!USER || USER.step !== 'ready') return '';
  const worthLosing = Object.keys(USER.feedback).length + Object.keys(USER.library).length;
  if (worthLosing < 3) return '';

  const now = Date.now();
  if (USER.exportSnooze && now < Date.parse(USER.exportSnooze)) return '';
  const since = Date.parse(USER.lastExport || USER.created || 0);
  if (Number.isFinite(since) && now - since < EXPORT_EVERY) return '';

  const days = Math.floor((now - since) / DAY);
  const never = !USER.lastExport;
  const when = never
    ? `You have never exported this profile`
    : `Last export was ${days} day${days === 1 ? '' : 's'} ago`;
  return `<div class="banner"><div>
    <b>${when}.</b> Your ${worthLosing} ratings and saves live only in this browser —
    clearing site data or switching devices loses them.
    </div><div class="acts-row">
    <button class="btn" data-act="export">Export now</button>
    <button class="btn ghost" data-act="snooze">Not now</button>
    </div></div>`;
}

async function importProfile(file) {
  const u = JSON.parse(await file.text());
  if (!u.id || !Array.isArray(u.subtopics)) throw new Error('Not a Your Journal profile');
  const profiles = listProfiles().filter(p => p.id !== u.id);
  profiles.push({ id: u.id, name: u.name });
  lsSet('profiles', profiles);
  lsSet('u:' + u.id, u);
  lsSet('active', u.id);
  return u;
}

/* ------------------------------------------------------------------ scoring */

function tokenize(text) {
  const out = [];
  for (const raw of text.toLowerCase().replace(/[^a-z0-9-]+/g, ' ').split(/\s+/)) {
    const w = raw.replace(/^-+|-+$/g, '');
    if (w.length < 3 || STOP.has(w) || /^\d+$/.test(w)) continue;
    out.push(w);
  }
  return out;
}

function termsOf(text) {
  const t = tokenize(text);
  const out = t.slice();
  for (let i = 0; i + 1 < t.length; i++) out.push(t[i] + ' ' + t[i + 1]);
  return out;
}

const subtopicIndex = () => {
  const m = new Map();
  for (const s of DATA.taxonomy.specialties) for (const st of s.subtopics) m.set(s.id + ':' + st.id, [s, st]);
  return m;
};

function userTerms(u) {
  const idx = subtopicIndex(), counts = new Map();
  for (const key of u.subtopics) {
    const pair = idx.get(key);
    if (!pair) continue;
    for (const t of pair[1].terms) counts.set(t.toLowerCase(), (counts.get(t.toLowerCase()) || 0) + 1);
  }
  const out = new Map();
  for (const [t, c] of counts) out.set(t, Math.min(1, 0.62 + 0.16 * (c - 1)));
  return out;
}

const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const hasPhrase = (hay, p) => new RegExp('(?<![a-z0-9])' + escRe(p) + '(?![a-z0-9])').test(hay);

function axisSignal(hay, ax) {
  let lo = 0, hi = 0;
  for (const s of ax.low_signals) if (hay.includes(s)) lo++;
  for (const s of ax.high_signals) if (hay.includes(s)) hi++;
  return lo + hi === 0 ? 0 : (hi - lo) / (lo + hi);
}

function scoreArticle(a, u, terms, priors) {
  const text = [a.title, a.abstract, (a.keywords || []).join(' '), (a.mesh || []).join(' '),
    (a.pubtypes || []).join(' ')].join(' ');
  const hay = ' ' + text.toLowerCase().replace(/\s+/g, ' ') + ' ';

  const hits = [];
  for (const [t, w] of terms) if (hasPhrase(hay, t)) hits.push([t, w]);
  hits.sort((x, y) => y[1] - x[1]);
  const topic = hits.length ? Math.min(1, hits.slice(0, 6).reduce((s, h) => s + h[1], 0) / 2.6) : 0;

  let axTotal = 0, axN = 0;
  const axDetail = {};
  for (const ax of DATA.axes.axes) {
    const pref = u.axisScores[ax.id];
    if (pref === undefined) continue;
    const sig = axisSignal(hay, ax);
    if (sig === 0) continue;
    const c = pref * sig;
    axDetail[ax.id] = Math.round(c * 100) / 100;
    axTotal += c; axN++;
  }
  const axis = axN ? axTotal / axN : 0;

  const jp = priors[(a.journal || '').toLowerCase()] ?? 0.6;

  let learnedRaw = 0;
  const seen = new Set(termsOf(text));
  for (const t of seen) learnedRaw += u.weights[t] || 0;
  const learned = Math.tanh(learnedRaw / 4);

  let base = 0.52 * topic + 0.14 * jp
    + 0.18 * Math.max(0, axis) + 0.10 * Math.min(0, axis)
    + 0.16 * Math.max(0, learned) + 0.16 * Math.min(0, learned);

  const pt = (a.pubtypes || []).join(' ').toLowerCase();
  if (/editorial|comment|news/.test(pt)) base *= 0.55;
  if (/retracted|erratum/.test(pt)) base *= 0.15;
  if (!a.abstract) base *= 0.78;

  return {
    score: Math.round(Math.max(0, Math.min(1, base)) * 100),
    why: { topic: +topic.toFixed(3), axis: +axis.toFixed(3), journal: jp, learned: +learned.toFixed(3),
           matched: hits.slice(0, 8).map(h => h[0]), axisDetail: axDetail },
  };
}

function relearn(u) {
  const pos = new Map(), neg = new Map();
  let npos = 0, nneg = 0, n = 0;
  for (const r of Object.values(u.feedback)) {
    const w = VERDICT_W[r.verdict];
    if (!w) continue;
    n++;
    const ts = new Set(termsOf(r.text || r.title || ''));
    if (w > 0) { npos += w; for (const t of ts) pos.set(t, (pos.get(t) || 0) + w); }
    else { nneg += -w; for (const t of ts) neg.set(t, (neg.get(t) || 0) + -w); }
  }
  const weights = {};
  for (const t of new Set([...pos.keys(), ...neg.keys()])) {
    const p = pos.get(t) || 0, q = neg.get(t) || 0, mass = p + q;
    if (mass < 1.5 && n > 8) continue;
    let v = Math.log(((p + 0.5) / (npos + 1)) / ((q + 0.5) / (nneg + 1)));
    v *= mass / (mass + 3);
    if (Math.abs(v) > 0.05) weights[t] = +v.toFixed(4);
  }
  u.weights = weights;
}

/* ---------------------------------------------------------- journal picking */

function suggestJournals(u) {
  const idx = subtopicIndex(), score = new Map(), why = new Map();
  const depth = {};
  for (const k of u.subtopics) { const s = k.split(':')[0]; depth[s] = (depth[s] || 0) + 1; }

  const bump = (j, amt, label) => {
    score.set(j, (score.get(j) || 0) + amt);
    const list = why.get(j) || []; if (!list.includes(label)) list.push(label);
    why.set(j, list);
  };
  for (const sid of u.specialties) {
    const s = DATA.taxonomy.specialties.find(x => x.id === sid);
    if (!s) continue;
    const w = 1 + 0.35 * (depth[sid] || 0);
    for (const j of s.journals || []) bump(j, w, s.name);
  }
  for (const key of u.subtopics) {
    const pair = idx.get(key);
    if (!pair) continue;
    for (const j of pair[1].journals || []) bump(j, 1.6, pair[1].name);
  }
  if (!score.size) return [];
  const cutoff = Math.max(...score.values()) * 0.55;
  const out = [];
  for (const [abbrev, sc] of score) {
    const meta = DATA.journals.journals[abbrev];
    if (!meta) continue;
    out.push({ abbrev, name: meta.name, score: sc, volume: meta.count,
               why: (why.get(abbrev) || []).join(', ').slice(0, 120), core: sc >= cutoff });
  }
  out.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  return out.slice(0, 48);
}

/* ------------------------------------------------------------------- pubmed */

async function eutils(path, params) {
  const url = EUTILS + path + '?' + new URLSearchParams(params);
  const r = await fetch(url);
  if (!r.ok) throw new Error(`PubMed ${r.status}`);
  return r;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function parseArticles(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const out = [];
  for (const pa of doc.querySelectorAll('PubmedArticle')) {
    const txt = sel => { const n = pa.querySelector(sel); return n ? n.textContent.trim() : ''; };
    const parts = [];
    for (const ab of pa.querySelectorAll('Abstract > AbstractText')) {
      const label = ab.getAttribute('Label');
      parts.push(label ? `${label}: ${ab.textContent.trim()}` : ab.textContent.trim());
    }
    const authors = [];
    for (const a of pa.querySelectorAll('AuthorList > Author')) {
      const ln = a.querySelector('LastName'), ini = a.querySelector('Initials');
      if (ln) authors.push((ln.textContent + ' ' + (ini ? ini.textContent : '')).trim());
    }
    let doi = '';
    for (const id of pa.querySelectorAll('ArticleIdList > ArticleId')) {
      if (id.getAttribute('IdType') === 'doi') doi = id.textContent.trim();
    }
    const pmid = txt('MedlineCitation > PMID');
    out.push({
      pmid, doi,
      title: txt('Article > ArticleTitle').replace(/\s+/g, ' ').replace(/^\[|\]\.?$/g, ''),
      abstract: parts.join(' '),
      journal: txt('Journal > ISOAbbreviation') || txt('Journal > Title'),
      year: txt('Journal PubDate > Year'),
      authors,
      keywords: [...pa.querySelectorAll('KeywordList > Keyword')].map(k => k.textContent.trim()),
      mesh: [...pa.querySelectorAll('MeshHeading > DescriptorName')].map(m => m.textContent.trim()),
      pubtypes: [...pa.querySelectorAll('PublicationTypeList > PublicationType')].map(p => p.textContent.trim()),
      url: `https://pubmed.ncbi.nlm.nih.gov/${pmid}/`,
    });
  }
  return out;
}

async function runScan(u, days, onProgress) {
  const until = new Date();
  const since = new Date(until.getTime() - days * 864e5);
  const fmt = d => `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  const clause = u.journals.map(a => `"${a}"[ta]`).join(' OR ');
  const term = `(${clause}) AND ("${fmt(since)}"[EDAT] : "${fmt(until)}"[EDAT])`;

  onProgress('searching PubMed…', 0, 0);
  const sr = await (await eutils('esearch.fcgi', { db: 'pubmed', term, retmax: 2000, retmode: 'json', sort: 'date' })).json();
  const ids = sr.esearchresult.idlist || [];
  const seen = new Set(u.seen);
  const fresh = ids.filter(i => !seen.has(i));
  if (!fresh.length) return { articles: [], since: fmt(since), until: fmt(until), total: ids.length };

  const arts = [];
  const CHUNK = 100;
  for (let i = 0; i < fresh.length; i += CHUNK) {
    const batch = fresh.slice(i, i + CHUNK);
    onProgress('fetching records', Math.min(i + CHUNK, fresh.length), fresh.length);
    try {
      const r = await eutils('efetch.fcgi', { db: 'pubmed', id: batch.join(','), retmode: 'xml' });
      arts.push(...parseArticles(await r.text()));
    } catch (e) { console.warn('batch failed, skipping', e); }
    await sleep(400);
  }

  onProgress('scoring…', fresh.length, fresh.length);
  const terms = userTerms(u);
  const priors = {};
  for (const a of u.journals) priors[a.toLowerCase()] = (DATA.journals.journals[a] || {}).prior ?? 0.7;
  const names = {};
  for (const a of u.journals) names[a.toLowerCase()] = (DATA.journals.journals[a] || {}).name || a;

  for (const a of arts) {
    a.journalName = names[(a.journal || '').toLowerCase()] || a.journal;
    const { score, why } = scoreArticle(a, u, terms, priors);
    a.score = score; a.why = why;
  }
  arts.sort((x, y) => y.score - x.score);

  u.seen = [...new Set([...u.seen, ...arts.map(a => a.pmid)])].slice(-6000);
  return { articles: arts, since: fmt(since), until: fmt(until), total: ids.length,
           generated: new Date().toISOString(), journals: u.journals.length };
}

/* ---------------------------------------------------- optional Claude rerank */

async function claudeRerank(run, u, onProgress) {
  const key = lsGet('anthropicKey', '');
  if (!key) throw new Error('No API key set. Add one in Settings.');
  const top = run.articles.slice(0, 30);
  const payload = top.map((a, i) => ({
    rank: i + 1, pmid: a.pmid, prior: a.score, title: a.title,
    journal: a.journalName, abstract: (a.abstract || '').slice(0, 2200),
    matched: a.why.matched,
  }));
  const idx = subtopicIndex();
  const interests = u.subtopics.map(k => (idx.get(k) || [null, {}])[1].name).filter(Boolean);
  const axisSummary = Object.entries(u.axisScores).map(([id, v]) => {
    const ax = DATA.axes.axes.find(a => a.id === id);
    if (!ax || Math.abs(v) < 0.05) return null;
    return `${ax.name}: leans ${v > 0 ? ax.high_label : ax.low_label}`;
  }).filter(Boolean);

  const prompt =
`You are ranking this week's new medical literature for one reader.

READER PROFILE
Topics of interest: ${interests.join(', ')}
Reading style: ${axisSummary.join('; ') || 'no strong preferences recorded'}

The "prior" score on each article is a keyword heuristic. It is reliably wrong in
both directions: it over-rewards an article that merely repeats a matched phrase,
and under-rewards an on-topic article that happens not to use the configured
vocabulary. Correct it by reading the abstracts.

Return ONLY a JSON array, one object per article, no prose:
[{"pmid":"...","score":0-100,"blurb":"...","tag":"..."}]

score: predicted interest for THIS reader. 85-100 = will almost certainly read it.
70-84 = strong. 50-69 = runner-up. 25-49 = probably skip. 0-24 = off-target.
blurb: 1-2 concrete sentences. Lead with what was actually done and the number that
matters (n, effect, method). Not "this study investigates". Say why this reader
would care. If you moved something far from its prior, say so.
tag: 1-3 lowercase words.

ARTICLES
${JSON.stringify(payload)}`;

  onProgress('Claude is reading ' + top.length + ' abstracts…');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 16000,
      thinking: { type: 'adaptive' },
      output_config: { effort: 'high' },
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  if (!r.ok) {
    const body = await r.text();
    throw new Error(`Anthropic API ${r.status}: ${body.slice(0, 300)}`);
  }
  const data = await r.json();
  if (data.stop_reason === 'refusal') throw new Error('Request was declined by safety classifiers.');
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if (!textBlock) throw new Error('No text in response.');
  const m = textBlock.text.match(/\[[\s\S]*\]/);
  if (!m) throw new Error('Could not parse a JSON array from the response.');
  const scored = JSON.parse(m[0]);
  const byPmid = new Map(scored.map(s => [String(s.pmid), s]));
  for (const a of run.articles) {
    const s = byPmid.get(a.pmid);
    if (s) { a.claudeScore = Math.round(s.score); a.blurb = s.blurb || ''; a.tag = s.tag || ''; }
  }
  run.articles.sort((a, b) =>
    (b.claudeScore ?? b.score * 0.95) - (a.claudeScore ?? a.score * 0.95));
  run.reranked = new Date().toISOString();
  return scored.length;
}

const finalScore = a => (a.claudeScore ?? a.score);

/* Sample one question from every axis first, so no axis (notably adults-vs-children)
   can be squeezed out of a 12-question set by chance. */
/* Not every subtopic name reads well inside a sentence ("AI & clinical informatics
   at the bedside"). Keep the part before an ampersand, drop method-ish names, and fall
   back to questions that don't need a topic at all. */
const BAD_TOPIC = /informatics|methods|technology|synthesis|evidence|outcomes|workflow|equity|education|wellbeing/i;
function cleanTopics(names) {
  const out = [];
  for (const raw of names) {
    if (BAD_TOPIC.test(raw)) continue;            // test the FULL name, before trimming
    const n = raw.split('&')[0].split(',')[0].trim().toLowerCase();
    if (n.length < 5 || n.length > 34) continue;  // "ai" reads badly mid-sentence
    out.push(n);
  }
  return out;
}

function buildPairs() {
  const idx = subtopicIndex();
  const topics = cleanTopics(USER.subtopics.map(k => (idx.get(k) || [null, {}])[1].name).filter(Boolean));
  let seed = [...USER.id].reduce((a, c) => a + c.charCodeAt(0), 0) || 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const shuffle = arr => arr.map(v => [rnd(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);

  const axes = shuffle(DATA.axes.axes.slice());
  const picked = [];
  for (const ax of axes) {                       // one per axis, in random order
    const qs = shuffle(ax.questions.slice());
    picked.push({ ax, qi: ax.questions.indexOf(qs[0]), q: qs[0] });
  }
  const extras = [];
  for (const ax of axes) ax.questions.forEach((q, qi) => {
    if (!picked.some(p => p.ax.id === ax.id && p.qi === qi)) extras.push({ ax, qi, q });
  });
  const all = picked.concat(shuffle(extras)).slice(0, 12);

  return all.map((p, i) => {
    // If we have no usable topic, prefer a sibling question with no {topic} slot.
    let q = p.q;
    if (!topics.length && /\{topic\}/.test(q.low + q.high)) {
      const plain = p.ax.questions.find(x => !/\{topic\}/.test(x.low + x.high));
      if (plain) q = plain;
    }
    const topic = topics.length ? topics[i % topics.length] : 'your field';
    return {
      id: p.ax.id + '#' + p.ax.questions.indexOf(q), axis: p.ax.id, axisName: p.ax.name,
      low: q.low.replace('{topic}', topic),
      high: q.high.replace('{topic}', topic),
    };
  });
}

const STRUCT = /(?:^|(?<=[.\s]))(?:BACKGROUND|OBJECTIVES?|AIMS?|GOALS?|PURPOSE|INTRODUCTION|CONTEXT|RATIONALE|IMPORTANCE|DESCRIPTION|SUMMARY|UNLABELLED|METHODS?|MATERIALS|DESIGN|SETTINGS?|PARTICIPANTS|PATIENTS|SUBJECTS|INTERVENTIONS?|EXPOSURES?|MEASUREMENTS?|OUTCOMES?|MEASURES?|MAIN|PRIMARY|SECONDARY|STUDY|RESULTS|FINDINGS|CONCLUSIONS?|INTERPRETATION|DISCUSSION|IMPLICATIONS|SIGNIFICANCE|LIMITATIONS|KEY POINTS|TRIAL REGISTRATION|FUNDING)(?:[ /&,-]+(?:AND\s+)?(?:BACKGROUND|OBJECTIVES?|AIMS?|METHODS?|RESULTS|CONCLUSIONS?|MEASURES?|OUTCOMES?|DESIGN|FINDINGS))*\s*:\s*/g;

function firstSentences(text, n = 2, cap = 340) {
  if (!text) return '';
  let t = text.replace(STRUCT, '').replace(/\s{2,}/g, ' ').trim();
  const parts = t.split(/(?<=[.!?])\s+/);
  const out = parts.slice(0, n).join(' ').trim();
  return out.length > cap ? out.slice(0, cap).replace(/\s+\S*$/, '') + '…' : out;
}

/* Group the issue into named sections so the page has landmarks instead of one
   undifferentiated column. Sections come from the reader's own subtopics: an article
   belongs to the subtopic whose keywords it matches most. */
function sectionFor(a) {
  const idx = subtopicIndex();
  const matched = new Set((a.why?.matched || []).map(t => t.toLowerCase()));
  if (!matched.size) return null;
  let best = null, bestN = 0;
  for (const key of USER.subtopics) {
    const pair = idx.get(key);
    if (!pair) continue;
    let n = 0;
    for (const t of pair[1].terms) if (matched.has(t.toLowerCase())) n++;
    if (n > bestN) { bestN = n; best = pair[1].name; }
  }
  return bestN ? best : null;
}

function paperStory(a, size) {
  const au = a.authors || [];
  const who = au.length > 2 ? au[0] + ' et al.' : au.join(', ');
  const saved = !!USER.library[a.pmid];
  const dek = a.blurb || firstSentences(a.abstract, size === 'big' ? 3 : 2, size === 'big' ? 420 : 240);
  const btn = `<button class="sv paper-sv ${saved ? 'on' : ''}" data-papersave="${esc(a.pmid)}"
    title="Add to To Read Later">${saved ? '📖 Saved' : '📖'}</button>`;
  return `<div class="story ${size}">
    <div class="src">${esc(a.journalName || a.journal)}</div>
    <h4><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h4>
    <div class="dek">${esc(dek)}</div>
    <div class="storyfoot"><span class="src">${esc(who)}</span>
      <span class="scr">${finalScore(a)}</span>${btn}</div></div>`;
}

function viewPaper() {
  const run = USER.run;
  if (!run) return render('paper', '<div class="empty">No issue yet.</div>', true);
  const withAbs = run.articles.filter(a => a.abstract);
  const arts = (withAbs.length ? withAbs : run.articles).slice(0, 30);
  if (!arts.length) return render('paper', '<div class="empty">Nothing to print this week.</div>', true);

  const lead = arts[0];
  const la = lead.authors || [];
  const leadWho = la.length > 2 ? la[0] + ' et al.' : la.join(', ');
  const kicker = lead.tag || sectionFor(lead) || (lead.why?.matched || [])[0] || 'Lead';
  const today = new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const leadSaved = !!USER.library[lead.pmid];

  // Two secondary stories get their own band under the lead, then the rest are
  // grouped into named sections.
  const seconds = arts.slice(1, 3);
  const rest = arts.slice(3);
  const groups = new Map();
  for (const a of rest) {
    const k = sectionFor(a) || 'Also of note';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(a);
  }
  // Merge one-article sections into "Also of note" so the page isn't all headers.
  const singles = [];
  for (const [k, v] of [...groups]) {
    if (v.length === 1 && k !== 'Also of note') { singles.push(...v); groups.delete(k); }
  }
  if (singles.length) groups.set('Also of note', (groups.get('Also of note') || []).concat(singles));
  const ordered = [...groups.entries()].sort((a, b) => b[1].length - a[1].length);

  const sections = ordered.map(([name, list], i) => `
    <section class="psec">
      <div class="secthead"><span>${esc(name)}</span><span class="secn">${list.length}</span></div>
      <div class="cols${i % 2 ? ' two' : ''}">${list.map(a => paperStory(a, 'small')).join('')}</div>
    </section>`).join('');

  render('paper', toReadLaterStrip(3) + `<div class="paper">
    <div class="masthead"><h1>Your Journal</h1>
      <div class="dek">Curated for ${esc(USER.name)}</div></div>
    <div class="rule"><span>${esc(today)}</span><span>${run.articles.length} papers screened</span>
      <span>${run.journals} journals</span></div>

    <div class="lead"><div class="kick">${esc(kicker)}</div>
      <h3><a href="${esc(lead.url)}" target="_blank" rel="noopener">${esc(lead.title)}</a></h3>
      <div class="byline">${esc(leadWho)} · ${esc(lead.journalName || lead.journal)}</div>
      <div class="body"><p>${esc(lead.blurb || firstSentences(lead.abstract, 4, 900))}</p></div>
      <div class="storyfoot"><span class="scr">${finalScore(lead)}</span>
        <button class="sv paper-sv ${leadSaved ? 'on' : ''}" data-papersave="${esc(lead.pmid)}"
          title="Add to To Read Later">${leadSaved ? '📖 Saved' : '📖 Read later'}</button></div>
    </div>

    ${seconds.length ? `<div class="seconds">${seconds.map(a => paperStory(a, 'big')).join('')}</div>` : ''}
    ${sections}

    <div class="papernote">Assembled from ${run.articles.length} articles indexed ${run.since} to
      ${run.until}. <a data-view="feed">Rate these in the feed →</a> ·
      <a data-view="how">How the ranking works →</a></div></div>`, true);
}

function viewSaved() {
  const items = Object.values(USER.library).sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || ''));
  if (!items.length) return render('saved', `<h1>To Read Later</h1>
    <div class="empty">Nothing saved yet. Hit <b>📖 Read later</b> on any article in the
    <a data-view="feed">Feed</a> or <a data-view="paper">The Paper</a>.</div>`);
  render('saved', `<h1>To Read Later</h1>
    <div class="sub">${items.length} articles · newest first · saving never changes your ranking</div>` +
    items.map((it, i) => articleCard({ ...it, why: { matched: [] } }, i + 1, { noMeter: true })).join(''));
}

function viewSettings() {
  const idx = subtopicIndex();
  const subs = USER.subtopics.map(k => (idx.get(k) || [null, {}])[1].name).filter(Boolean);
  const axRows = Object.entries(USER.axisScores).map(([id, v]) => {
    const ax = DATA.axes.axes.find(a => a.id === id);
    if (!ax) return '';
    const strength = Math.abs(v) > 0.6 ? 'strongly' : Math.abs(v) > 0.2 ? 'mildly' : 'barely';
    const txt = Math.abs(v) > 0.05 ? `${strength} toward <b>${esc(v > 0 ? ax.high_label : ax.low_label)}</b>` : 'no preference';
    return `<div class="story"><div class="src">${esc(ax.name)}</div><div class="dek">${txt}</div></div>`;
  }).join('');
  const reg = DATA.journals.journals;
  const jl = USER.journals.map(a => (reg[a] || {}).name || a).join(', ');
  const n = { love: 0, like: 0, dislike: 0 };
  for (const r of Object.values(USER.feedback)) if (n[r.verdict] !== undefined) n[r.verdict]++;
  const key = lsGet('anthropicKey', '');
  render('settings', `<h1>Your formula</h1>
    <div class="sub">Everything here is editable. Changes apply from your next issue.
    <a data-view="how">How it all works →</a></div>
    <h2>Topics</h2><div class="sub">${esc(subs.join(', ')) || 'none'} · <a data-goto="subtopics">change</a></div>
    <h2>Reading style</h2><div class="cols two">${axRows}</div>
      <div class="sub" style="margin-top:1rem"><a data-goto="pairs">retake the this-or-that</a></div>
    <h2>Journals · ${USER.journals.length}</h2><div class="sub">${esc(jl) || 'none'} ·
      <a data-goto="journals">change or add more</a></div>
    <h2>What it has learned</h2>
      <div class="sub">${n.love} 👍👍 · ${n.like} 👍 · ${n.dislike} 👎 ·
      ${Object.keys(USER.weights).length} learned terms. The more you rate, the more your ranking
      diverges from the generic version of your specialty.</div>

    <h2>Claude re-rank (optional)</h2>
    <div class="sub">The feed ranks by keyword match. With an API key, Claude reads the top 30
      abstracts and rewrites the scores with a one-line reason each — the pass that makes this
      genuinely good. Roughly a few cents per issue.</div>
    <details class="keyhelp"><summary>How to get an Anthropic API key (2 minutes)</summary>
      <ol>
        <li>Go to <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a>
          and sign in. <b>This is the developer console, not the Claude chat app</b> — a Claude Pro or
          Max subscription does not include API credit; they're billed separately.</li>
        <li>If it's a new account, open <b>Billing</b> and add a small amount of credit
          (US$5 goes a very long way here — a weekly re-rank costs a few cents).</li>
        <li>Go to <b>Settings → API keys</b>, or straight to
          <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com/settings/keys</a>.</li>
        <li>Click <b>Create key</b>, name it something like <i>Your Journal</i>, and copy it.
          It starts with <code>sk-ant-</code>. <b>You can only see it once</b> — if you lose it,
          delete that key and make a new one.</li>
        <li>Paste it below and press Save.</li>
      </ol>
      <p><b>Where it goes.</b> The key is stored in this browser only and sent directly from your
      browser to Anthropic. It never reaches a server of ours, because there isn't one. Anyone with
      access to this device or browser profile can read it — so don't do this on a shared computer,
      and delete the key in the console if you ever stop using it.</p>
    </details>
    <div class="row"><input type="password" id="apikey" placeholder="sk-ant-..." value="${esc(key)}" autocomplete="off">
      <button class="btn" data-act="savekey">Save key</button>
      ${key ? '<button class="btn ghost" data-act="clearkey">Remove key</button>' : ''}</div>

    <h2>Your data</h2>
    <div class="sub">Everything lives in this browser. Clearing site data erases it — export a copy
      to move to another device or keep a backup.</div>
    <div class="row"><button class="btn ghost" data-act="export">Export profile</button>
      <button class="btn ghost" data-view="switch">Switch reader</button>
      <button class="btn ghost" data-act="scan">Fetch a new issue</button></div>`);
}

function viewBuilding(msg) {
  render('onboard', `<h1>Building your issue</h1>
    <div class="sub">Searching ${USER.journals.length} journals, then scoring each result against
    your formula. This takes under a minute.</div>
    <div class="note" id="scanbox"><b>${esc(msg || 'starting…')}</b></div>`);
}

function go(view) {
  if (view === 'how' && !USER) { const u = USER; USER = { name: '', step: '', library: {} };
    viewHow(); USER = u; return; }
  if (view === 'switch') { lsSet('active', null); USER = null; return viewPick(); }
  if (!USER) return viewPick();
  if (view === 'how') return viewHow();
  if (view === 'onboard') view = USER.step;
  switch (view) {
    case 'specialties': return viewSpecialties();
    case 'subtopics': return viewSubtopics();
    case 'pairs': return viewPairs();
    case 'journals': return viewJournals();
    case 'feed': case 'ready': return viewFeed();
    case 'paper': return viewPaper();
    case 'saved': return viewSaved();
    case 'settings': return viewSettings();
    default: return viewFeed();
  }
}

async function doScan() {
  if (!USER.journals.length) { toast('Pick some journals first.'); return go('journals'); }
  viewBuilding('starting…');
  const box = $('#scanbox');
  try {
    const run = await runScan(USER, 8, (msg, done, total) => {
      box.innerHTML = `<b>${esc(msg)}</b>${total ? ` — ${done.toLocaleString()} / ${total.toLocaleString()}` : ''}
        <div class="prog"><i style="width:${total ? Math.round(done / total * 100) : 5}%"></i></div>`;
    });
    if (!run.articles.length) {
      box.innerHTML = '<b>Nothing new since your last issue.</b> Try again in a few days.';
      setTimeout(() => go('feed'), 2200);
      return;
    }
    USER.run = run; USER.step = 'ready'; saveUser();
    go('feed');
  } catch (e) {
    box.innerHTML = `<b>Scan failed.</b> ${esc(e.message)}`;
  }
}

async function doRerank() {
  const run = USER.run;
  if (!run) return;
  const prev = $('#app').innerHTML;
  render('feed', `<h1>Re-ranking</h1><div class="note" id="rr"><b>starting…</b></div>`);
  try {
    const n = await claudeRerank(run, USER, msg => { $('#rr').innerHTML = `<b>${esc(msg)}</b>
      <div class="prog"><i style="width:60%"></i></div>`; });
    saveUser();
    toast(`Claude re-ranked ${n} articles.`);
    go('feed');
  } catch (e) {
    $('#rr').innerHTML = `<b>Re-rank failed.</b> ${esc(e.message)}
      <div style="margin-top:.6rem">Your keyword ranking is unchanged. <a data-view="feed">Back to the feed</a> ·
      <a data-view="settings">Settings</a></div>`;
  }
}

function findArticle(pmid) {
  return (USER.run?.articles || []).find(a => a.pmid === pmid) || USER.library[pmid] || { pmid, title: '', abstract: '' };
}

document.addEventListener('click', async e => {
  const t = e.target;

  const use = t.closest('[data-use]');
  if (use) { const u = loadProfile(use.dataset.use); if (u) { USER = u; lsSet('active', u.id); go(u.step === 'ready' ? 'feed' : 'onboard'); } return; }

  const viewEl = t.closest('[data-view]');
  if (viewEl) { e.preventDefault(); return go(viewEl.dataset.view); }

  const gotoEl = t.closest('[data-goto]');
  if (gotoEl) { e.preventDefault(); return go(gotoEl.dataset.goto); }

  if (t.id === 'create') {
    const name = $('#newname').value.trim();
    if (!name) return toast('Enter a name.');
    USER = newProfile(name.slice(0, 40));
    return go('onboard');
  }

  const selAll = t.closest('[data-selectall]'), selNone = t.closest('[data-selectnone]');
  if (selAll || selNone) {
    const sid = (selAll || selNone).dataset.selectall || (selNone).dataset.selectnone;
    const grp = (selAll || selNone).closest('.grp');
    grp.querySelectorAll('.pick.multi').forEach(p => p.classList.toggle('on', !!selAll));
    const form = grp.closest('form'), btn = form?.querySelector('[data-count]');
    if (btn) { const n = form.querySelectorAll('.pick.multi.on').length;
      btn.disabled = n === 0; btn.textContent = btn.dataset.count.replace('{n}', n); }
    return;
  }

  // 📖 from The Paper
  const psave = t.closest('[data-papersave]');
  if (psave) {
    const pmid = psave.dataset.papersave, on = !USER.library[pmid];
    const a = findArticle(pmid);
    if (on) {
      USER.library[pmid] = { pmid, title: a.title, journalName: a.journalName || a.journal,
        authors: (a.authors || []).slice(0, 6), url: a.url, score: finalScore(a),
        blurb: a.blurb || '', savedAt: new Date().toISOString() };
    } else delete USER.library[pmid];
    saveUser();
    psave.classList.toggle('on', on);
    psave.textContent = on ? '📖 Saved' : '📖';
    toast(on ? 'Added to To Read Later' : 'Removed');
    return;
  }

  const unsave = t.closest('[data-unsave]');
  if (unsave) { delete USER.library[unsave.dataset.unsave]; saveUser(); return go(currentView()); }

  const multi = t.closest('.pick.multi');
  if (multi) {
    multi.classList.toggle('on');
    const form = multi.closest('form');
    const btn = form?.querySelector('[data-count]');
    if (btn) {
      const n = form.querySelectorAll('.pick.multi.on').length;
      btn.disabled = n === 0;
      btn.textContent = btn.dataset.count.replace('{n}', n);
    }
    return;
  }

  const pb = t.closest('.pair button[data-choice]');
  if (pb) {
    const box = pb.closest('.pair');
    box.querySelectorAll('button').forEach(b => b.classList.remove('on'));
    pb.classList.add('on');
    box.dataset.answer = pb.dataset.choice;
    const form = $('#pairform');
    const btn = form.querySelector('[data-count]');
    const done = form.querySelectorAll('.pair[data-answer]').length;
    btn.disabled = done === 0;
    btn.textContent = btn.dataset.count.replace('{n}', done);
    return;
  }

  const vb = t.closest('.acts button[data-v]');
  if (vb) {
    const w = vb.closest('.acts'), pmid = w.dataset.pmid;
    const v = w.dataset.verdict === vb.dataset.v ? '' : vb.dataset.v;
    w.dataset.verdict = v;
    w.querySelectorAll('button[data-v]').forEach(b => b.classList.toggle('on', !!v && b.dataset.v === v));
    w.closest('.card')?.classList.toggle('dis', v === 'dislike');
    const a = findArticle(pmid);
    if (v) {
      USER.feedback[pmid] = { verdict: v, ts: new Date().toISOString(), title: a.title,
        journal: a.journalName || a.journal, predicted: finalScore(a),
        text: [a.title, a.abstract, (a.keywords || []).join(' '), (a.mesh || []).join(' ')].join(' ') };
    } else delete USER.feedback[pmid];
    relearn(USER); saveUser();
    const st = w.querySelector('.st');
    st.textContent = v ? 'saved' : 'cleared'; st.classList.add('show');
    setTimeout(() => st.classList.remove('show'), 1600);
    return;
  }

  const sb = t.closest('.acts button.sv');
  if (sb) {
    const w = sb.closest('.acts'), pmid = w.dataset.pmid, on = !w.dataset.saved;
    w.dataset.saved = on ? '1' : '';
    sb.classList.toggle('on', on); sb.textContent = on ? '★' : '☆';
    w.closest('.card')?.classList.toggle('sav', on);
    const a = findArticle(pmid);
    if (on) {
      USER.library[pmid] = { pmid, title: a.title, journalName: a.journalName || a.journal,
        authors: (a.authors || []).slice(0, 6), url: a.url, score: finalScore(a),
        blurb: a.blurb || '', savedAt: new Date().toISOString() };
    } else delete USER.library[pmid];
    saveUser();
    return;
  }

  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'scan') return doScan();
  if (act === 'rerank') return doRerank();
  if (act === 'export') { exportProfile(); toast('Exported. Keep the file somewhere you will find it.'); return go(currentView()); }
  if (act === 'snooze') {
    USER.exportSnooze = new Date(Date.now() + SNOOZE_FOR).toISOString();
    saveUser();
    toast('Reminder paused for 3 days.');
    return go(currentView());
  }
  if (act === 'savekey') {
    const v = $('#apikey').value.trim();
    if (!v) return toast('Paste a key first.');
    lsSet('anthropicKey', v); toast('Key saved in this browser.'); return go('settings');
  }
  if (act === 'clearkey') { lsSet('anthropicKey', ''); toast('Key removed.'); return go('settings'); }
});

document.addEventListener('submit', e => {
  const form = e.target;
  e.preventDefault();
  if (form.id === 'multi') {
    const vals = [...form.querySelectorAll('.pick.multi.on')].map(p => p.dataset.val);
    const next = form.dataset.next;
    if (next === 'subtopics') {
      USER.specialties = vals;
      const valid = new Set();
      for (const sid of vals) {
        const s = DATA.taxonomy.specialties.find(x => x.id === sid);
        if (s) for (const st of s.subtopics) valid.add(sid + ':' + st.id);
      }
      USER.subtopics = USER.subtopics.filter(k => valid.has(k));
      USER.step = 'subtopics';
    } else if (next === 'pairs') {
      if (!vals.length) return toast('Pick at least one subtopic.');
      USER.subtopics = vals; USER.step = 'pairs';
    } else if (next === 'ready') {
      if (!vals.length) return toast('Pick at least one journal.');
      USER.journals = vals; USER.step = 'ready'; saveUser();
      return doScan();
    }
    saveUser();
    return go(USER.step);
  }
  if (form.id === 'pairform') {
    const tally = {};
    form.querySelectorAll('.pair').forEach(b => {
      const ans = b.dataset.answer;
      if (!ans) return;
      const ax = b.dataset.axis;
      tally[ax] = tally[ax] || [0, 0];
      if (ans === 'low') tally[ax][0] -= 1;
      else if (ans === 'high') tally[ax][0] += 1;
      tally[ax][1] += 1;
    });
    const scores = {};
    for (const [ax, [total, n]] of Object.entries(tally)) {
      if (n) scores[ax] = +Math.max(-1, Math.min(1, total / n)).toFixed(3);
    }
    USER.axisScores = scores; USER.step = 'journals'; saveUser();
    return go('journals');
  }
});

document.addEventListener('input', e => {
  if (e.target.id !== 'jsearch') return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#jbrowse .pick').forEach(p => {
    p.style.display = !q || (p.dataset.search || '').includes(q) ? '' : 'none';
  });
});

document.addEventListener('change', async e => {
  if (e.target.id === 'importfile' && e.target.files[0]) {
    try { USER = await importProfile(e.target.files[0]); toast('Profile restored.'); go(USER.step === 'ready' ? 'feed' : 'onboard'); }
    catch (err) { toast('Import failed: ' + err.message); }
  }
});

/* -------------------------------------------------------------------- boot */

(async function boot() {
  try {
    DATA = window.__YJ_DATA__;
  } catch (e) {
    $('#app').innerHTML = `<div class="wrap"><h1>Couldn't load data</h1>
      <div class="sub">${esc(e.message)}. If you opened this file directly, serve it over http
      (<code>python3 -m http.server</code>) — browsers block fetch on file:// URLs.</div></div>`;
    return;
  }
  const active = lsGet('active', null);
  USER = active ? loadProfile(active) : null;
  go(USER ? (USER.step === 'ready' ? 'feed' : 'onboard') : 'pick');
})();

</script>
</body>
</html>
